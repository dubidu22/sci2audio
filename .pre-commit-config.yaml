repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      # The sample corpus is stored byte for byte (a Markdown hard break is two trailing
      # spaces), and so are the syrupy golden files (#176)
      - id: end-of-file-fixer
        exclude: ^tests/(corpus/|.*/__snapshots__/)
      - id: trailing-whitespace
        exclude: ^tests/(corpus/|.*/__snapshots__/)
  # The layer rules (D-46) take a few seconds, so they run on every commit; the tests stay in CI
  - repo: local
    hooks:
      - id: lint-imports
        name: lint-imports (layer rules)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
