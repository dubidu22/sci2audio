[project]
name = "sci2audio"
dynamic = ["version"]
description = "Turn scientific texts into faithful, offline audiobooks with local voices."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.12"
authors = [{ name = "Colin Meng" }]
keywords = ["text-to-speech", "audiobook", "accessibility", "pdf", "epub", "science"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
]
dependencies = [
    "fastapi>=0.162.5,<1",
    "imageio-ffmpeg>=0.8.1,<0.9",
    "jinja2>=3.1.6,<4",
    "kokoro>=0.9.4,<0.10",
    "markdown-it-py>=4.2,<5",
    "mdit-py-plugins>=0.6.1,<0.7",
    # Bounded here because the offline guarantee relies on how misaki 0.9 loads its spaCy
    # model (D-121); kokoro alone would accept any later misaki. The German voice imports
    # its espeak-ng pronunciation (misaki.espeak, #211).
    "misaki[en]>=0.9.4,<0.10",
    "numpy>=2.0",
    "platformdirs>=4.14.5,<5",
    "pydantic>=2.14,<3",
    "pypdfium2>=5.15.2,<6",
    "python-multipart>=0.0.33,<0.1",
    "requests>=2.32",
    "spacy>=3.8,<4",
    "starlette>=1.10,<2",
    "torch>=2.6",
    "uvicorn>=0.54,<1",
]

[project.urls]
Homepage = "https://sci2audio.com"
Repository = "https://github.com/dubidu22/sci2audio"
Issues = "https://github.com/dubidu22/sci2audio/issues"

[project.scripts]
sci2audio = "sci2audio.cli:main"

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8,<1",
    "deptry>=0.25",
    "hatchling>=1.27",
    "httpx>=0.28.1,<1",
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "mutmut>=3.8.1",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5",
    "playwright>=1.65.1,<2",
    "pre-commit>=4.0",
    "pytest>=9.0",
    "pytest-benchmark>=5.3.1",
    "pytest-playwright>=0.10.0,<1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6",
    "ruff>=0.17",
    "schemathesis>=4.33.4,<5",
    "syrupy>=6.1.1",
    "zizmor>=1.32.0",
]
# Nightly speech-recognition round trip only (#9); the fast CI jobs do not install it.
asr = [
    "faster-whisper>=1.2",
]

# Our own lock (CI and contributors) takes torch from the PyTorch CPU index on Linux, so
# it does not pull the CUDA libraries (1.3 GB instead of 5.6 GB, D-48, VA-02). Published
# metadata cannot name an index: Linux users who want the small install pass
# `--torch-backend cpu` (see README).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sci2audio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sci2audio"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks; subprocess in tests runs our own CLI.
"tests/**" = ["S101", "S603"]
# These modules and their tests are about look-alike characters: their docstrings, comments
# and test strings show them on purpose (code strings in src use escapes).
"src/sci2audio/textprep/{characters,hyphens}.py" = ["RUF002", "RUF003"]
"tests/unit/test_textprep_{characters,hyphens}.py" = ["RUF001", "RUF002", "RUF003"]
# phoneme strings (IPA) are what the German voice tests are about (#211)
"tests/unit/test_voices_german.py" = ["RUF001"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: needs models, audio or the full sample corpus; runs nightly, not on every PR",
    "benchmark: speed measurement with pytest-benchmark; runs nightly",
    "browser: drives the interface in a real browser (Playwright, tests/browser); own CI job",
    "quarantined(issue, reason, platform=None): flaky test skipped until its issue is fixed (D-374); all must be fixed before v1.0",
]

[tool.mutmut]
source_paths = ["src/sci2audio/"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-m", "not browser"]  # needs a Playwright browser (D-259)
# Files outside src/ and tests/ that tests read from the repository root (mutmut copies
# only those two into mutants/): the scripts they import and the README they check.
also_copy = ["scripts/", "README.md"]

[tool.deptry]
known_first_party = ["sci2audio"]

[tool.deptry.per_rule_ignores]
# jinja2 and python-multipart are loaded by Starlette for templates and uploads (web).
DEP002 = ["jinja2", "python-multipart"]

[tool.importlinter]
root_package = "sci2audio"
# needed by the web framework contract below: it names packages outside sci2audio
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: entry points -> app | testing -> pipeline stages -> core (D-46, D-63, Q11)"
type = "layers"
layers = [
    "sci2audio.cli",
    "sci2audio.web",
    "sci2audio.app | sci2audio.testing",
    "sci2audio.extraction | sci2audio.layout | sci2audio.textprep | sci2audio.voices | sci2audio.output",
    "sci2audio.core",
]

[[tool.importlinter.contracts]]
name = "Nothing in the program imports the conformance suite (Q11)"
type = "forbidden"
source_modules = ["sci2audio.cli", "sci2audio.web"]
forbidden_modules = ["sci2audio.testing"]

[[tool.importlinter.contracts]]
name = "Only the web layer imports the web framework (D-205)"
type = "forbidden"
# cli loads sci2audio.web for `sci2audio ui` only, so it is not listed
source_modules = [
    "sci2audio.core",
    "sci2audio.extraction",
    "sci2audio.layout",
    "sci2audio.textprep",
    "sci2audio.voices",
    "sci2audio.output",
    "sci2audio.app",
    "sci2audio.testing",
]
forbidden_modules = [
    "fastapi",
    "starlette",
    "uvicorn",
    "jinja2",
    "multipart",
    "python_multipart",
    "pydantic",
]
