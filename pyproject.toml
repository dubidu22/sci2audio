[project]
name = "sci2audio"
dynamic = ["version"]
description = "Turn scientific texts into faithful, offline audiobooks with local voices."
readme = "README.md"
license = "GPL-3.0-or-later AND OFL-1.1"  # OFL-1.1: the bundled interface fonts (D-670)
license-files = [
  "LICENSE",
  "THIRD_PARTY_LICENSES.md",
  "src/sci2audio/web/static/fonts/OFL-atkinson.txt",
  "src/sci2audio/web/static/fonts/OFL-literata.txt",
]
requires-python = ">=3.12"
authors = [{ name = "Colin Meng" }]
keywords = ["text-to-speech", "audiobook", "accessibility", "pdf", "epub", "science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
]
dependencies = [
    "fastapi>=0.162.5,<1",
    "imageio-ffmpeg>=0.8.1,<0.9",
    "jinja2>=3.1.6,<4",
    "kokoro>=0.9.4,<0.10",
    "markdown-it-py>=4.2,<5",
    "mdit-py-plugins>=0.6.1,<0.8",
    # Bounded here because the offline guarantee relies on how misaki 0.9 loads its spaCy
    # model (D-121); kokoro alone would accept any later misaki. The German voice imports
    # its espeak-ng pronunciation (misaki.espeak, #211).
    "misaki[en]>=0.9.4,<0.10",
    "numpy>=2.0",
    "platformdirs>=4.14.5,<5",
    "pydantic>=2.14,<3",
    "pypdfium2>=5.15.2,<6",
    "python-multipart>=0.0.33,<0.1",
    "requests>=2.32",
    "spacy>=3.8,<4",
    "starlette>=1.10,<2",
    "torch>=2.6",
    "uvicorn>=0.54,<1",
]

[project.urls]
Repository = "https://github.com/dubidu22/sci2audio"
Issues = "https://github.com/dubidu22/sci2audio/issues"

[project.optional-dependencies]
# The app's own window (#215, D-797): WKWebView on macOS, WebView2 on Windows. The
# installers include it; without it `sci2audio-app` opens the browser instead.
window = [
    "pywebview>=6.2.1,<7",
]

[project.scripts]
sci2audio = "sci2audio.cli:main"

[project.gui-scripts]
sci2audio-app = "sci2audio.web.window:main"

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8,<1",
    "deptry>=0.25",
    "hatchling>=1.27",
    "httpx>=0.28.1,<1",
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "mutmut>=3.8.1",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5",
    "playwright>=1.65.1,<2",
    "pre-commit>=4.0",
    # exact: each pyright release finds new errors, so a bump is a change of its own (#1099);
    # the nodejs extra brings Node.js as a wheel, so nothing is downloaded at run time
    "pyright[nodejs]==1.1.414",
    "pytest>=9.0",
    "pytest-benchmark>=5.3.1",
    "pytest-playwright>=0.10.0,<1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6",
    "ruff>=0.17",
    "schemathesis>=4.33.4,<5",
    "syrupy>=6.1.1",
    "zizmor>=1.32.0",
]
# Builds the installers (#215, D-797); only the installers workflow installs it.
installer = [
    "pyinstaller>=6.22.3,<7",
    "pyinstaller-hooks-contrib>=2026.10",
]
# Nightly speech-recognition round trip only (#9); the fast CI jobs do not install it.
asr = [
    "faster-whisper>=1.2",
]

# Our own lock (CI and contributors) takes torch from the PyTorch CPU index on Linux, so
# it does not pull the CUDA libraries (1.3 GB instead of 5.6 GB, D-48, VA-02). Published
# metadata cannot name an index: Linux users who want the small install pass
# `--torch-backend cpu` (see README).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sci2audio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sci2audio"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# governance/ holds the archived KB (records and probe scripts), not product code;
# .claude/ holds the owner-merge-guard hook, a script Claude Code runs, not product code
extend-exclude = ["governance", ".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks; subprocess in tests runs our own CLI.
"tests/**" = ["S101", "S603"]
# the installer build and smoke scripts run the build tools and the installed program (#215)
"scripts/{build_installer,installer_smoke}.py" = ["S603"]
# These modules and their tests are about look-alike characters: their docstrings, comments
# and test strings show them on purpose (code strings in src use escapes).
"src/sci2audio/textprep/{characters,hyphens}.py" = ["RUF002", "RUF003"]
"tests/unit/test_textprep_{characters,hyphens}.py" = ["RUF001", "RUF002", "RUF003"]
# phoneme strings (IPA) are what the German voice (#211) and letter pace (#295) tests are about
"tests/unit/test_voices_{german,letters}.py" = ["RUF001"]

[tool.pyright]
include = ["src"]
# Copied from CPython and kept as close to it as possible, so a newer CPython copies over
# with a plain diff (D-777); type fixes there would be changes of our own.
exclude = ["src/sci2audio/extraction/htmlparser.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: needs models, audio or the full sample corpus; runs nightly, not on every PR",
    "benchmark: speed measurement with pytest-benchmark; runs nightly",
    "browser: drives the interface in a real browser (Playwright, tests/browser); own CI job",
    "quarantined(issue, reason, platform=None, browser=None): flaky test skipped until its issue is fixed (D-374); all must be fixed before v1.0",
    "every_pdf_read: each PDF read starts its own reader process, none is reused from an earlier test (D-581)",
    "deep: takes more inputs with HYPOTHESIS_PROFILE=nightly without being a Hypothesis test; the nightly property job runs it (D-759)",
]

[tool.mutmut]
source_paths = ["src/sci2audio/"]
# CPython's HTML parser, copied verbatim and never edited here (#175, D-777): its mutants
# would only cost a run's time (#633). mutmut copies it unmutated, so it still imports.
do_not_mutate = ["src/sci2audio/extraction/htmlparser.py"]
pytest_add_cli_args_test_selection = ["tests/"]
# The browser tests need a Playwright browser (D-259). The linear-time check of a page of
# drawings compares two timings against a ratio close to its limit, which mutmut's
# trampolines distort: it failed the unmutated run of tests/unit at 32.5 against 32 (#1093).
pytest_add_cli_args = [
    "-m",
    "not browser",
    "--deselect",
    "tests/unit/test_layout_figure_speed.py::test_a_page_of_drawings_is_laid_out_in_linear_time",
]
# Files outside src/ and tests/ that tests read from the repository root (mutmut copies
# only those two into mutants/): the scripts they import, the README they check, the
# CI workflows they read (test_ci_workflows.py, #360), the licence table whose font
# hashes test_web_design.py checks (#549), and every other root file tests/unit reads
# (the docs, the archived KB, the packaging files, the changelog, the licence and the
# project file), so the whole of tests/unit runs there (#1093).
also_copy = [
    "scripts/",
    "README.md",
    ".github/",
    "THIRD_PARTY_LICENSES.md",
    "docs/",
    "governance/",
    "packaging/",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.deptry]
known_first_party = ["sci2audio"]

[tool.deptry.package_module_name_map]
pywebview = "webview"

[tool.deptry.per_rule_ignores]
# jinja2 and python-multipart are loaded by Starlette for templates and uploads (web).
DEP002 = ["jinja2", "python-multipart"]

[tool.importlinter]
root_package = "sci2audio"
# needed by the web framework contract below: it names packages outside sci2audio
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: entry points -> app | testing -> pipeline stages -> core (D-46, D-63, Q11)"
type = "layers"
layers = [
    "sci2audio.cli",
    "sci2audio.web",
    "sci2audio.app | sci2audio.testing",
    "sci2audio.extraction | sci2audio.layout | sci2audio.textprep | sci2audio.voices | sci2audio.output",
    "sci2audio.core",
]

[[tool.importlinter.contracts]]
name = "Nothing in the program imports the conformance suite (Q11)"
type = "forbidden"
source_modules = ["sci2audio.cli", "sci2audio.web"]
forbidden_modules = ["sci2audio.testing"]

[[tool.importlinter.contracts]]
name = "Only the web layer imports the web framework (D-205)"
type = "forbidden"
# cli loads sci2audio.web for `sci2audio ui` only, so it is not listed
source_modules = [
    "sci2audio.core",
    "sci2audio.extraction",
    "sci2audio.layout",
    "sci2audio.textprep",
    "sci2audio.voices",
    "sci2audio.output",
    "sci2audio.app",
    "sci2audio.testing",
]
forbidden_modules = [
    "fastapi",
    "starlette",
    "uvicorn",
    "jinja2",
    "multipart",
    "python_multipart",
    "pydantic",
    "webview",  # the app's window (#215)
]
