# Paths whose change is critical: a PR that touches one gets risk:high.
"risk:high":
  - changed-files:
      - any-glob-to-any-file:
          - "src/sci2audio/core/**"
          - ".github/**"
          - "pyproject.toml"
          - "uv.lock"
          - "tests/corpus/**"
          - "tests/unit/__snapshots__/**"
          - "tests/regression/**"
          - "THIRD_PARTY_LICENSES.md"
          - ".claude/**"
          - "CLAUDE.md"
