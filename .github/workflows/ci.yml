name: CI

# Scratch branch only (#525, TST-08): the fixed keep-alive test alone 40 times on Windows,
# then the whole fast suite 4 times with -n auto (the load it failed under). Any red run
# fails the job; the summary holds the real counts.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  isolate:
    name: isolate 525 (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --locked
      - name: The test alone, 40 runs
        shell: bash
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          test=tests/unit/test_web_jobs.py::test_events_keep_the_stream_alive_and_end_when_the_server_stops
          pass=0; fail=0
          for i in $(seq 40); do
            if uv run pytest "$test" -q; then pass=$((pass+1)); else fail=$((fail+1)); fi
          done
          echo "alone: $pass PASSED, $fail FAILED" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$fail" -eq 0
      - name: The whole fast suite with -n auto, 4 runs
        if: always()
        shell: bash
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          pass=0; fail=0
          for i in $(seq 4); do
            if uv run pytest -m "not slow and not benchmark and not browser" -n auto -q; then pass=$((pass+1)); else fail=$((fail+1)); fi
          done
          echo "full suite -n auto: $pass PASSED, $fail FAILED" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$fail" -eq 0
