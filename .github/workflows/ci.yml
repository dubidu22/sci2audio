name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check --output-format=github
      - name: Ruff format
        run: uv run ruff format --check
      - name: Layer rules (import-linter)
        run: uv run lint-imports
      - name: Dependencies (deptry)
        run: uv run deptry src

  licences:
    name: licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # Only the app's own run-time dependencies are checked, not the dev tools.
      - run: uv sync --locked --no-dev
      - name: Refuse AGPL, non-commercial and unknown licences
        run: >
          uv run --no-sync --with pip-licenses pip-licenses
          --ignore-packages sci2audio pip-licenses prettytable wcwidth
          --partial-match
          --fail-on="Affero;AGPL;SSPL;Non-Commercial;NonCommercial;UNKNOWN"
          --format=markdown

  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - name: Fast tests
        run: uv run pytest -m "not slow" -n auto

  # The only check required by the ruleset on main. Its name must not change.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, licences, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "At least one job did not succeed: ${{ toJSON(needs) }}"
          exit 1
      - run: echo "All checks passed."
