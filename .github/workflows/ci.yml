name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Ruff lint (incl. security rules)
        run: uv run ruff check --output-format=github
      - name: Ruff format
        run: uv run ruff format --check
      - name: Layer rules (import-linter)
        run: uv run lint-imports
      - name: Dependencies (deptry)
        run: uv run deptry src

  licences:
    name: licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Only the app's own run-time dependencies are checked, not the dev tools.
      # espeakng-loader states no licence in its package metadata; it was checked by hand
      # (loader MIT, bundled espeak-ng GPL-3.0-or-later) and is listed in THIRD_PARTY_LICENSES.md.
      - run: uv sync --locked --no-dev
      - name: Refuse AGPL, non-commercial and unknown licences
        run: >
          uv run --no-sync --with pip-licenses pip-licenses
          --ignore-packages sci2audio pip-licenses prettytable wcwidth espeakng-loader
          --partial-match
          --fail-on="Affero;AGPL;SSPL;Non-Commercial;NonCommercial;UNKNOWN"
          --format=markdown

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Known vulnerabilities in run-time dependencies (pip-audit)
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements.txt -o runtime-requirements.txt
          uv run pip-audit --requirement runtime-requirements.txt --disable-pip --no-deps --progress-spinner off
      - name: Workflow security (zizmor)
        run: uv run zizmor --offline .github/workflows

  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Fast tests (unit, property-based, golden files)
        run: uv run pytest -m "not slow and not benchmark and not browser" -n auto
        env:
          HYPOTHESIS_PROFILE: ci
      # PE-02 (D-224): the installed command on one corpus PDF, as a person runs it.
      - name: Smoke test (sci2audio script on a corpus PDF)
        shell: bash
        run: |
          uv run sci2audio script tests/corpus/papers/joss2021-waskom-seaborn.pdf \
            -o "$RUNNER_TEMP/smoke" --work-folder "$RUNNER_TEMP/smoke-work" --ignore-settings
          for suffix in script.txt report.json report.md; do
            test -s "$RUNNER_TEMP/smoke/joss2021-waskom-seaborn.$suffix"
          done

  # The interface in a real browser (#77, #8, D-259): main flow, keyboard-only path and
  # axe-core. Chromium on Linux on every PR; Firefox and WebKit run nightly.
  browser:
    name: browser (Linux, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      # A CI download of the test browser; the tests themselves never use the network.
      - name: Install Chromium for Playwright
        run: uv run playwright install --with-deps chromium
      - name: Browser tests (main flow, keyboard, axe-core)
        run: uv run pytest -m browser --browser chromium -rA
        env:
          HYPOTHESIS_PROFILE: ci

  # The only check required by the ruleset on main. Its name must not change.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, licences, security, tests, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "At least one job did not succeed: $RESULTS"
          exit 1
      - run: echo "All checks passed."
