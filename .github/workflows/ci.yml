name: CI

# PRs run everything on Linux but Python 3.13; macOS, Windows and Python 3.13 join with the
# label "ci:full", on every push to main and release/*, and on a run by hand (D-580, #1132).
# Tags need no run here: the release workflow installs and runs the built wheel on all three
# systems first.
# Labels start no run here: one would cancel the run of the same commit and leave its
# "CI passed" red (#360). Adding "ci:full" starts a run by hand on the PR's branch
# instead (ci-full-label.yml, D-620); a push to a PR with the label tests all three.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Python of .python-version (3.12.16 or newer), as uv downloads it; never the runner's
  # own, which is older on macOS and Windows and reads broken HTML differently (D-378, #175).
  UV_PYTHON_PREFERENCE: only-managed

# A newer push to a PR cancels its older run, which tested an older commit. Every other run
# (main, release/*, by hand) is a group of its own, so none is cancelled or held back (D-580).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint and layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          cache-python: true  # the uv-managed CPython of .python-version, not downloaded each run
          cache-suffix: py-${{ hashFiles('.python-version') }}  # a new Python gets a new cache
      - run: uv sync --locked
      - name: Ruff lint (incl. security rules)
        run: uv run ruff check --output-format=github
      - name: Ruff format
        run: uv run ruff format --check
      - name: Layer rules (import-linter)
        run: uv run lint-imports
      - name: Dependencies (deptry)
        run: uv run deptry src
      - name: No working files on this branch (D-874)
        run: python3 .github/scripts/working_files.py
      # D-374: flaky tests are skipped with a linked issue; all must be fixed before v1.0.
      - name: Quarantined tests (listed in the job summary)
        run: |
          uv run pytest -m quarantined --collect-only -q -p no:cacheprovider | tee quarantined.txt
          {
            echo "## Quarantined tests (D-374)"
            echo
            echo "Each is skipped until its issue is fixed; all must be fixed before v1.0 (#80)."
            echo
            echo '```'
            grep -E '^ +#[0-9]+ ' quarantined.txt || echo "none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  licences:
    name: licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          cache-python: true  # the uv-managed CPython of .python-version, not downloaded each run
          cache-suffix: py-${{ hashFiles('.python-version') }}  # a new Python gets a new cache
      # Only the app's own run-time dependencies are checked, not the dev tools.
      # espeakng-loader states no licence in its package metadata; it was checked by hand
      # (loader MIT, bundled espeak-ng GPL-3.0-or-later) and is listed in THIRD_PARTY_LICENSES.md.
      # with the app window's extra (#215), as the installers bundle it
      - run: uv sync --locked --no-dev --extra window
      - name: Refuse AGPL, non-commercial and unknown licences
        run: >
          uv run --no-sync --with pip-licenses pip-licenses
          --ignore-packages sci2audio pip-licenses prettytable wcwidth espeakng-loader
          --partial-match
          --fail-on="Affero;AGPL;SSPL;Non-Commercial;NonCommercial;UNKNOWN"
          --format=markdown

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          cache-python: true  # the uv-managed CPython of .python-version, not downloaded each run
          cache-suffix: py-${{ hashFiles('.python-version') }}  # a new Python gets a new cache
      - run: uv sync --locked
      - name: Known vulnerabilities in run-time dependencies (pip-audit)
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements.txt -o runtime-requirements.txt
          uv run pip-audit --requirement runtime-requirements.txt --disable-pip --no-deps --progress-spinner off
      - name: Workflow security (zizmor)
        run: uv run zizmor --offline .github/workflows

  # Reported only until #1104 makes it required (#1099): src/ still has type errors, which
  # #1100-#1103 fix layer by layer, and "CI passed" skips a name with "reported only" in it.
  types:
    name: types (pyright, reported only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          cache-python: true  # the uv-managed CPython of .python-version, not downloaded each run
          cache-suffix: py-${{ hashFiles('.python-version') }}  # a new Python gets a new cache
      # with the app window's extra, or its pywebview imports read as missing (#215)
      - run: uv sync --locked --extra window
      - name: Type check (pyright)
        env:
          PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"  # else it asks PyPI for a newer pyright
        run: |
          status=0
          uv run --no-sync pyright > pyright.txt || status=$?
          sed -i "s|$GITHUB_WORKSPACE/||" pyright.txt
          cat pyright.txt
          {
            echo "## Type check (pyright, reported only until #1104)"
            echo
            # exit 1 is type errors; anything higher is pyright itself failing, which a red
            # reported-only job would otherwise hide among the errors
            if [ "$status" -gt 1 ]; then
              echo "**pyright did not finish (exit $status): fix the check, not the code.**"
            else
              tail -n 1 pyright.txt
            fi
            echo
            echo '```'
            cat pyright.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Linux 3.12 in three shards on every run, a third of the tests each, so the fast suite no
  # longer sets a PR's wait (#1132): same job id, so "CI passed" needs every shard. macOS and
  # Windows join with the label "ci:full", on every push to main and release/*, and on a run
  # by hand (D-580); they run the suite whole under the names rules and the ruleset use.
  # requires-python (>=3.12) lets people install on 3.13, where a chapter once lost its text
  # while 3.12 passed (#587, #792). Its leg runs where the full run goes, so a 3.13 break is
  # caught minutes after a merge and never reaches a release (#1132). As a leg it exists only
  # where it runs: "CI passed" waits for it there and never meets it skipped.
  tests:
    name: tests (${{ matrix.os }}${{ matrix.shard && format(', {0}/3', matrix.shard) || '' }}${{ matrix.python && format(', py{0}', matrix.python) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && '[{"os":"ubuntu-latest","shard":1},{"os":"ubuntu-latest","shard":2},{"os":"ubuntu-latest","shard":3},{"os":"macos-latest"},{"os":"windows-latest"},{"os":"ubuntu-latest","python":"3.13"}]' || '[{"os":"ubuntu-latest","shard":1},{"os":"ubuntu-latest","shard":2},{"os":"ubuntu-latest","shard":3}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # sets UV_PYTHON, which wins over .python-version for uv sync and uv run; still
          # uv's own CPython (only-managed). Empty, and so unset, on every leg but 3.13.
          python-version: ${{ matrix.python }}
          cache-python: true  # the uv-managed CPython, not downloaded each run
          # a new Python gets a new cache, and 3.13 never the cache of the .python-version legs
          cache-suffix: ${{ matrix.python && format('py{0}', matrix.python) || format('py-{0}', hashFiles('.python-version')) }}
      - run: uv sync --locked
      # Should a later change let .python-version win, this leg would test 3.12 twice unseen.
      - name: The tests run on Python 3.13
        if: matrix.python == '3.13'
        run: uv run python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 13)"
      # Every third collected test from this shard's number on, so a new test file needs no
      # change here and the slow tests of one file are spread over all shards.
      - name: The fast tests of this shard
        if: matrix.shard
        env:
          HYPOTHESIS_PROFILE: ci  # the run's own profile, should it ever decide what is collected
          SHARD: ${{ matrix.shard }}
        run: uv run --no-sync python .github/scripts/shard.py "not slow and not benchmark and not browser" "$SHARD" 3 "$RUNNER_TEMP/shard.txt"
      # The 25 slowest tests close the log, so a new slow test shows in the PR that adds it.
      - name: Fast tests (unit, property-based, golden files)
        shell: bash
        env:
          HYPOTHESIS_PROFILE: ci
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -n "$SHARD" ]; then set -- "@$RUNNER_TEMP/shard.txt"; fi
          uv run pytest -m "not slow and not benchmark and not browser" -n auto --durations=25 "$@"
      # PE-02 (D-224): the installed command on one corpus PDF, as a person runs it; once per
      # system on Python 3.12.
      - name: Smoke test (sci2audio script on a corpus PDF)
        if: matrix.shard == 1 || (!matrix.shard && !matrix.python)
        shell: bash
        run: |
          uv run sci2audio script tests/corpus/papers/joss2021-waskom-seaborn.pdf \
            -o "$RUNNER_TEMP/smoke" --work-folder "$RUNNER_TEMP/smoke-work" --ignore-settings
          for suffix in script.txt report.json report.md; do
            test -s "$RUNNER_TEMP/smoke/joss2021-waskom-seaborn.$suffix"
          done

  # The interface in a real browser (#77, #8, D-259): main flow, keyboard-only path and
  # axe-core. Chromium on Linux on every PR; Firefox and WebKit on a PR that changes a web
  # path (browser-reported) and in the nightly.
  # Three shards on three runners, a third of the tests each, so the browser tests no longer
  # set the run's length (D-759 item 3, #1132): every shard must pass for "CI passed".
  browser:
    name: browser (Linux, Chromium, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          cache-python: true  # the uv-managed CPython of .python-version, not downloaded each run
          cache-suffix: py-${{ hashFiles('.python-version') }}  # a new Python gets a new cache
      - run: uv sync --locked
      # A CI download of the test browser; the tests themselves never use the network.
      # The Playwright browser comes from the cache when the playwright version is unchanged;
      # `install --with-deps` still adds the system packages and skips a cached download.
      - name: Where the Playwright browsers go, and their version
        id: playwright
        shell: bash
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
          echo "version=$(uv run --no-sync python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      # CI publishes nothing, so the release/* push trigger is no publishing path; the cached
      # browser only runs the tests of this job (the release workflow uses no cache).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning] v6.1.0
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for Playwright
        run: uv run playwright install --with-deps chromium
      # Every third collected test from this shard's number on, so a new test file needs no
      # change here and the slow tests of one file are spread over all shards.
      - name: The tests of this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: uv run --no-sync python .github/scripts/shard.py browser "$SHARD" 3 "$RUNNER_TEMP/shard.txt" --browser chromium
      - name: Browser tests (main flow, keyboard, axe-core)
        run: uv run pytest -m browser --browser chromium -rA "@$RUNNER_TEMP/shard.txt"
        env:
          HYPOTHESIS_PROFILE: ci

  # Does this PR change the web interface or its browser tests (D-759, plan item 4)? Then
  # Firefox and WebKit on Linux run too. Not a PR (main, release/*, by hand): they run nightly.
  web-paths:
    name: web paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read  # the PR's list of changed files
    outputs:
      web: ${{ steps.files.outputs.web }}
    steps:
      - name: Does this PR change the web interface or its browser tests
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "Not a PR: Firefox and WebKit run in the nightly."
            exit 0
          fi
          gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > files.txt
          if grep -E '^(src/sci2audio/(web|app)/|tests/browser/)' files.txt; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "No web path changed: Firefox and WebKit run in the nightly."
          fi

  # Firefox and WebKit on Linux for a PR that changes a web path (D-759, plan item 4). Reported
  # only until #437 closes: "CI passed" does not need them and its check of every job skips a
  # name with "reported only" in it. The nightly still runs all engines, WebKit on macOS too.
  browser-reported:
    name: browser (Linux, ${{ matrix.browser }}, ${{ matrix.shard }}/2, reported only)
    needs: web-paths
    if: needs.web-paths.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40  # `playwright install --with-deps` can wait long on apt
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          cache-python: true  # the uv-managed CPython of .python-version, not downloaded each run
          cache-suffix: py-${{ hashFiles('.python-version') }}  # a new Python gets a new cache
      - run: uv sync --locked
      - name: Where the Playwright browsers go, and their version
        id: playwright
        shell: bash
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
          echo "version=$(uv run --no-sync python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning] v6.1.0
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Install the browser for Playwright
        env:
          BROWSER: ${{ matrix.browser }}
        run: uv run playwright install --with-deps "$BROWSER"
      # A runner has no sound card: Firefox then fails every <audio>, so the player tests
      # need a sound server that plays into its null sink (#205).
      - name: A silent sound server for Firefox
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get install --yes --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
      - name: The tests of this shard
        env:
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}
        run: uv run --no-sync python .github/scripts/shard.py browser "$SHARD" 2 "$RUNNER_TEMP/shard.txt" --browser "$BROWSER"
      - name: Browser tests (main flow, keyboard, axe-core)
        env:
          BROWSER: ${{ matrix.browser }}
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest -m browser --browser "$BROWSER" -rA "@$RUNNER_TEMP/shard.txt"

  # The only check required by the ruleset on main. Its name must not change.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, licences, security, tests, browser, web-paths]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # to read the result of every job of this run (#548)
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "At least one job did not succeed: $RESULTS"
          exit 1
      # needs.<job>.result of a matrix job can read success while one of its legs was
      # cancelled, e.g. a macOS leg that never got a runner (#548). So every job of this run,
      # each matrix leg on its own, is read back and must have succeeded.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Fail if any job of this run did not succeed (every matrix leg)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/ci_passed.py
      - run: echo "All checks passed."
      - name: Which systems ran the tests
        if: always()
        env:
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ "$FULL" = true ]; then
            echo "Tests ran on Linux, macOS and Windows, and on Python 3.13 on Linux." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Tests ran on Linux only: add the label ci:full for macOS, Windows and Python 3.13 (D-580, #1132)." >> "$GITHUB_STEP_SUMMARY"
          fi
