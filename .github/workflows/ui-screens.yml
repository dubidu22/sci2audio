name: Screenshots of every page

# The label "ui:screens" on a PR renders every page of the interface (#386, D-627): each page
# state at 1440 x 900 and 1280 x 800, in light English, dark English and light German, with
# corpus documents only (tests/browser/test_screens.py). The images are uploaded as one
# artifact named after the PR's head commit, so a review compares them with the design's
# prototype/app/screens/ without running anything. They are not golden files: nothing
# compares them pixel by pixel. Any other label, and a PR from a fork, starts nothing.
on:
  pull_request:
    types: [labeled]

permissions: {}

env:
  UV_PYTHON_PREFERENCE: only-managed  # the Python of .python-version, as in CI (D-378)

jobs:
  screens:
    name: screenshots of every page
    if: github.event.label.name == 'ui:screens' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          cache-python: true
          cache-suffix: py-${{ hashFiles('.python-version') }}
      - run: uv sync --locked
      # A CI download of the test browser, as the browser job of ci.yml; the pages
      # themselves load nothing from outside the test server.
      - name: Where the Playwright browsers go, and their version
        id: playwright
        shell: bash
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
          echo "version=$(uv run --no-sync python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      # Publishes nothing: the cached browser only renders this PR's pages.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning] v6.1.0
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for Playwright
        run: uv run playwright install --with-deps chromium
      - name: Render every page
        shell: bash
        run: |
          echo "SCI2AUDIO_SCREENS=$RUNNER_TEMP/screens" >> "$GITHUB_ENV"
          SCI2AUDIO_SCREENS="$RUNNER_TEMP/screens" uv run pytest tests/browser/test_screens.py -m browser --browser chromium -rA
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/screens/
          if-no-files-found: error
          retention-days: 30
      - name: List the screenshots
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "## Screenshots of $HEAD"
            echo
            echo "Artifact \`screens-$HEAD\`: state-width-variant (light, dark, de)."
            echo
            find "$SCI2AUDIO_SCREENS" -name '*.png' -printf '%f\n' | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
