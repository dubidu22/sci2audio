# Runs the pull-request checks a machine can do (title, closing keywords, lane label, file ownership,
# critical paths, new markdown files, narrating comments), so they are not left to a thread remembering a rule. Copy to
# .github/workflows/governance-pr-checks.yml, with pr_checks.py and pr-checks.json in .github/governance/.
# Then make this check required in the branch protection of the default branch.
# Not run by the skill's own tests: check the syntax and the action versions before relying on it.
name: governance pr checks
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    name: governance pr checks  # the status-check name the main ruleset requires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that a risk:high PR has an approving review round for its head
        if: ${{ !cancelled() }}
        # D-882: the ledger comes from branch governance, never from the PR, and the tool that judges it from the
        # PR's base commit. It runs first, before any step runs the PR's code, which could otherwise change
        # $GITHUB_ENV, $GITHUB_PATH or the runner for it. Read-only token either way. The round entry lands
        # after this run, so the review thread re-runs the check once it pushed its approval (MRG-01).
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          case ",$PR_LABELS," in
            *,risk:high,*) ;;
            *) echo "Not risk:high: no review round needed here."; exit 0 ;;
          esac
          git fetch --no-tags origin +refs/heads/governance:refs/remotes/origin/governance
          mkdir "$RUNNER_TEMP/governance"
          git archive origin/governance governance/ledger | tar -x -C "$RUNNER_TEMP/governance"
          tool="$RUNNER_TEMP/ledger_tool.py"
          git show "$PR_BASE:governance/tools/ledger_tool.py" > "$tool" 2> /dev/null || true
          if ! grep -q '^def approved(' "$tool"; then
            # bootstrap (#743): the base has no approved command yet
            cp governance/tools/ledger_tool.py "$tool"
          fi
          python3 "$tool" approved "$PR_NUMBER" --head "$PR_HEAD" --ledger "$RUNNER_TEMP/governance/governance/ledger"
      - name: Check title, labels, ownership and critical paths
        if: ${{ !cancelled() }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-status "$PR_BASE...$PR_HEAD" > "$RUNNER_TEMP/changed.txt"
          git log --format=%B "$PR_BASE..$PR_HEAD" > "$RUNNER_TEMP/commits.txt"
          git diff "$PR_BASE...$PR_HEAD" > "$RUNNER_TEMP/diff.txt"
          python3 .github/governance/pr_checks.py --config .github/governance/pr-checks.json \
            --title "$PR_TITLE" --labels "$PR_LABELS" \
            --files "$RUNNER_TEMP/changed.txt" --commits "$RUNNER_TEMP/commits.txt" --diff "$RUNNER_TEMP/diff.txt"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: ${{ !cancelled() }}
      - name: Check that the promised tests exist
        if: ${{ !cancelled() }}
        # opt-in (#687): only a body with the heading costs a sync and a collection of the named files
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/body.md"
          mapfile -t files < <(python3 .github/governance/promised_tests.py files "$RUNNER_TEMP/body.md")
          if [ "${#files[@]}" -gt 0 ]; then
            uv run --frozen pytest --collect-only -q -p no:cacheprovider "${files[@]}" > "$RUNNER_TEMP/collected.txt" || true
            # the promises already on the base are shown, not judged (#711): the base's files,
            # collected with the head's environment so the note costs no second sync
            if git worktree add --detach --quiet "$RUNNER_TEMP/base" "$PR_BASE"; then
              script="$GITHUB_WORKSPACE/.github/governance/promised_tests.py"
              mapfile -t old < <(cd "$RUNNER_TEMP/base" && python3 "$script" files "$RUNNER_TEMP/body.md")
              if [ "${#old[@]}" -gt 0 ]; then
                (cd "$RUNNER_TEMP/base" && PYTHONPATH="$RUNNER_TEMP/base/src" "$GITHUB_WORKSPACE/.venv/bin/python" \
                  -m pytest --collect-only -q -p no:cacheprovider "${old[@]}") > "$RUNNER_TEMP/base-collected.txt" || true
              fi
            fi
          fi
          python3 .github/governance/promised_tests.py check "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/collected.txt" "$RUNNER_TEMP/base-collected.txt"
