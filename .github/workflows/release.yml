name: Release

# A tag vX.Y.Z builds the package, installs the built wheel on Linux, macOS and Windows and
# runs it on a corpus PDF, and only then publishes to PyPI; after that it makes the GitHub
# release from the changelog and installs the release from PyPI on all three systems
# (#80, D-484 to D-487).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # TEMPORARY, for the branch run before review; removed again

permissions:
  contents: read

env:
  # The Python of .python-version (3.12.16 or newer), as uv downloads it; never the runner's
  # own, which is older on macOS and Windows and reads broken HTML differently (D-378, #175).
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: The tag names the package's version
        if: github.event_name == 'push'  # TEMPORARY
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/sci2audio/__init__.py)
          echo "tag $TAG, package version $version"
          test "$TAG" = "v$version"
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # The built wheel, installed as a person installs it, on a corpus PDF (#80, D-485). Offline
  # like CI's smoke test: no voice download (D-487); the nightly run covers the real voice.
  smoke:
    name: installed wheel (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # for .python-version and the corpus PDF only
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Install the wheel with uv tool, as the README says
        shell: bash
        run: |
          wheel=$(ls "$GITHUB_WORKSPACE"/dist/sci2audio-*.whl)
          backend=()
          if [ "$RUNNER_OS" = Linux ]; then backend=(--torch-backend cpu); fi
          cd "$RUNNER_TEMP"  # outside the checkout: nothing can be imported from the source tree
          uv tool install --python "$(cat "$GITHUB_WORKSPACE/.python-version")" "${backend[@]}" "$wheel"
      - name: Run it on a corpus PDF
        shell: bash
        run: bash scripts/release_smoke.sh "$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/sci2audio/__init__.py)"

  publish:
    name: publish to PyPI
    needs: [build, smoke]
    if: github.event_name == 'push'  # TEMPORARY
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing, no stored token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # The GitHub release: the tag's section of CHANGELOG.md, with the sdist and wheel (D-486).
  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # this job only: it creates the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v head="## [$version]" '
            index($0, head) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"  # the changelog has a section for this version
          gh release create "$TAG" dist/* --verify-tag --title "sci2audio $version" \
            --notes-file "$RUNNER_TEMP/notes.md"

  # The release as PyPI serves it, on clean runners (D-485).
  from-pypi:
    name: install from PyPI (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # for .python-version and the corpus PDF only
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install sci2audio from PyPI (waits up to 10 minutes for the index)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          backend=()
          if [ "$RUNNER_OS" = Linux ]; then backend=(--torch-backend cpu); fi
          python=$(cat "$GITHUB_WORKSPACE/.python-version")
          cd "$RUNNER_TEMP"
          for attempt in $(seq 20); do
            if uv tool install --refresh --python "$python" "${backend[@]}" "sci2audio==${TAG#v}"; then
              exit 0
            fi
            echo "attempt $attempt: not installable yet; waiting 30 s"
            sleep 30
          done
          exit 1
      - name: Run it on a corpus PDF
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release_smoke.sh "${TAG#v}"
