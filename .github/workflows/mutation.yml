name: Mutation testing

# Run by hand (Actions -> Mutation testing -> Run workflow), e.g. monthly or
# before a release. Shows which code changes the tests fail to notice.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Python of .python-version (3.12.16 or newer), as uv downloads it; never the runner's
  # own, which is older on macOS and Windows and reads broken HTML differently (D-378, #175).
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  mutmut:
    name: mutmut
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      # mutmut exits 0 when it has run every mutant, whatever their results; a non-zero
      # exit means the run itself broke (for example the first, unmutated test run failed),
      # and the job must say so instead of listing every mutant as "not checked".
      - name: Mutation run
        run: uv run mutmut run
      - name: Results
        run: uv run mutmut results
