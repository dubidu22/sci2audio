name: Nightly

# Slow tests (voices, models, the whole corpus, speech-recognition round-trip),
# benchmarks, the fast tests on Python 3.13 (#1138), and how long pull requests wait for
# "CI passed" (#1133). Not required for merging; a red nightly run is a P1 Issue.
# A run by hand can leave parts out (D-759), so a branch check that needs only the
# browsers holds no runners for the slow tests; the scheduled run always runs every part.
# The pull-request wait has no switch: it only reads CI's runs, for about a minute.
on:
  schedule:
    - cron: "17 2 * * *"  # 02:17 UTC every day
  workflow_dispatch:
    inputs:
      browsers:
        description: Browser tests (Chromium, Firefox, WebKit on Linux and macOS)
        type: boolean
        default: true
      slow:
        description: Slow tests on Linux, macOS and Windows
        type: boolean
        default: true
      property:
        description: Property-based tests with many examples
        type: boolean
        default: true
      benchmarks:
        description: Benchmarks and the speed script
        type: boolean
        default: true
      py313:
        description: Fast tests on Python 3.13 (Linux)
        type: boolean
        default: true

permissions:
  contents: read

# A second run by hand on main waits for the first instead of running beside it (D-580).
# On any other branch a newer run by hand cancels the older one, which checked an older
# commit or asked for other parts (D-759); the scheduled run is never cancelled.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

env:
  # The Python of .python-version (3.12.16 or newer), as uv downloads it; never the runner's
  # own, which is older on macOS and Windows and reads broken HTML differently (D-378, #175).
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  slow-tests:
    name: slow tests (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' || inputs.slow
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          cache-python: true  # the uv-managed CPython of .python-version, not downloaded each run
          cache-suffix: py-${{ hashFiles('.python-version') }}  # a new Python gets a new cache
      - run: uv sync --locked --group asr
      - name: Cache the voice and speech-recognition models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-models
          # Bump with the pinned revisions in voices/download.py and prepare_models.py.
          key: test-models-${{ runner.os }}-kokoro-f3ff357-spacy-3.8.0-de-734e593-whisper-536b066
      # The only step with network: sci2audio's own voice download plus the whisper model.
      - name: Fetch the models (skips files already cached)
        shell: bash
        run: uv run python tests/integration/prepare_models.py "$RUNNER_TEMP/test-models/voices" "$RUNNER_TEMP/test-models/whisper"
      # One at a time: the voice already uses every core, so two workers took as long (D-759).
      - name: Slow tests (the network is blocked inside the tests)
        shell: bash
        env:
          HYPOTHESIS_PROFILE: nightly
          SCI2AUDIO_TEST_MODELS: ${{ runner.temp }}/test-models/voices
          SCI2AUDIO_TEST_WHISPER: ${{ runner.temp }}/test-models/whisper
        run: uv run pytest -m slow -rA

  property-deep:
    name: property-based tests, many examples
    if: github.event_name != 'workflow_dispatch' || inputs.property
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          cache-python: true  # the uv-managed CPython of .python-version, not downloaded each run
          cache-suffix: py-${{ hashFiles('.python-version') }}  # a new Python gets a new cache
      - run: uv sync --locked
      # Only the tests that take more inputs at night: the ones Hypothesis drives (its pytest
      # plugin marks them "hypothesis") and the fixed-seed fuzz tests marked "deep". The others
      # take the same inputs on every PR (D-759); test_ci_workflows.py checks that every test
      # reading HYPOTHESIS_PROFILE is selected here.
      - name: Hypothesis with the nightly profile
        env:
          HYPOTHESIS_PROFILE: nightly
        run: uv run pytest -m "(hypothesis or deep) and not slow and not benchmark and not browser" -n auto

  # CI tests 3.13 only on pushes to main and release/* and under ci:full (#1132), so a 3.13
  # break from a dependency moving on a quiet day shows here within a day (#1138). Whole and
  # with CI's ci profile, as CI's 3.13 leg runs it: nobody waits on it, and the same tests
  # make a red night comparable with a red CI run.
  fast-py313:
    name: fast tests (ubuntu-latest, py3.13)
    if: github.event_name != 'workflow_dispatch' || inputs.py313
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # sets UV_PYTHON, which wins over .python-version; still uv's own CPython
          python-version: "3.13"
          cache-python: true
          cache-suffix: py3.13  # the cache of CI's 3.13 leg, never the .python-version one
      - run: uv sync --locked
      # Should a later change let .python-version win, this job would test 3.12 unseen.
      - name: The tests run on Python 3.13
        run: uv run python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 13)"
      - name: Fast tests on Python 3.13
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest -m "not slow and not benchmark and not browser" -n auto --durations=25

  browsers:
    name: browser (${{ matrix.browser }}, ${{ matrix.os }}, ${{ matrix.shard }}/2)
    if: github.event_name != 'workflow_dispatch' || inputs.browsers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # #8: all three engines; WebKit on macOS too, the engine of the app window (D-47).
        # Each in two shards on two runners, half the tests each, one at a time (D-759).
        os: [ubuntu-latest]
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
        include:
          - { os: macos-latest, browser: webkit, shard: 1 }
          - { os: macos-latest, browser: webkit, shard: 2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          cache-python: true  # the uv-managed CPython of .python-version, not downloaded each run
          cache-suffix: py-${{ hashFiles('.python-version') }}  # a new Python gets a new cache
      - run: uv sync --locked
      # The Playwright browser comes from the cache when the playwright version is unchanged;
      # `install --with-deps` still adds the system packages and skips a cached download.
      - name: Where the Playwright browsers go, and their version
        id: playwright
        shell: bash
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
          echo "version=$(uv run --no-sync python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Install the browser for Playwright
        env:
          BROWSER: ${{ matrix.browser }}
        run: uv run playwright install --with-deps "$BROWSER"
      # A runner has no sound card. Firefox, unlike Chromium and WebKit, then fails every
      # <audio> with OnMediaSinkAudioError, so the player tests need a sound server that
      # plays into its null sink (#205).
      - name: A silent sound server for Firefox
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get install --yes --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
      - name: The tests of this shard
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}
        run: uv run --no-sync python .github/scripts/shard.py browser "$SHARD" 2 "$RUNNER_TEMP/shard.txt" --browser "$BROWSER"
      - name: Browser tests (main flow, keyboard, axe-core)
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
          HYPOTHESIS_PROFILE: nightly
        run: uv run pytest -m browser --browser "$BROWSER" -rA "@$RUNNER_TEMP/shard.txt"

  benchmarks:
    name: benchmarks
    if: github.event_name != 'workflow_dispatch' || inputs.benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          cache-python: true  # the uv-managed CPython of .python-version, not downloaded each run
          cache-suffix: py-${{ hashFiles('.python-version') }}  # a new Python gets a new cache
      - run: uv sync --locked --group asr
      - name: Cache the voice and speech-recognition models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-models
          # Bump with the pinned revisions in voices/download.py and prepare_models.py.
          key: test-models-${{ runner.os }}-kokoro-f3ff357-spacy-3.8.0-de-734e593-whisper-536b066
      # The only step with network: sci2audio's own voice download plus the whisper model.
      - name: Fetch the models (skips files already cached)
        shell: bash
        run: uv run python tests/integration/prepare_models.py "$RUNNER_TEMP/test-models/voices" "$RUNNER_TEMP/test-models/whisper"
      - name: Benchmarks (trend only; CI machines vary)
        shell: bash
        env:
          SCI2AUDIO_TEST_MODELS: ${{ runner.temp }}/test-models/voices
        run: uv run pytest -m benchmark --benchmark-only --benchmark-json=benchmark.json
      # The speed script against the real voice, so it cannot rot (D-287); numbers in the log.
      - name: Speed script, short run on the CPU (trend only)
        shell: bash
        run: uv run python scripts/speed.py --quick --device cpu --models-folder "$RUNNER_TEMP/test-models/voices" --json "$RUNNER_TEMP/speed.json"

  # The budget is the wait a pull request feels, so it is judged on CI's own runs (#1131).
  # A red result is for a person to act on: the job may read the runs and write nothing.
  pr-wait:
    name: pull-request wait (budget 6 min)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # to read CI's pull-request runs and their jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Median wait for "CI passed" over the last 20 pull-request runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/pr_wait.py
