name: Nightly

# Slow tests (voices, models, the whole corpus, speech-recognition round-trip)
# and benchmarks. Not required for merging; a red nightly run is a P1 Issue.
on:
  schedule:
    - cron: "17 2 * * *"  # 02:17 UTC every day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-tests:
    name: slow tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --group asr
      - name: Cache the voice and speech-recognition models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-models
          # Bump with the pinned revisions in voices/download.py and prepare_models.py.
          key: test-models-${{ runner.os }}-kokoro-f3ff357-spacy-3.8.0-whisper-536b066
      # The only step with network: sci2audio's own voice download plus the whisper model.
      - name: Fetch the models (skips files already cached)
        shell: bash
        run: uv run python tests/integration/prepare_models.py "$RUNNER_TEMP/test-models/voices" "$RUNNER_TEMP/test-models/whisper"
      - name: Slow tests (the network is blocked inside the tests)
        shell: bash
        env:
          HYPOTHESIS_PROFILE: nightly
          SCI2AUDIO_TEST_MODELS: ${{ runner.temp }}/test-models/voices
          SCI2AUDIO_TEST_WHISPER: ${{ runner.temp }}/test-models/whisper
        run: uv run pytest -m slow -rA

  property-deep:
    name: property-based tests, many examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Hypothesis with the nightly profile
        env:
          HYPOTHESIS_PROFILE: nightly
        run: uv run pytest -m "not slow and not benchmark"

  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --group asr
      - name: Cache the voice and speech-recognition models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-models
          # Bump with the pinned revisions in voices/download.py and prepare_models.py.
          key: test-models-${{ runner.os }}-kokoro-f3ff357-spacy-3.8.0-whisper-536b066
      # The only step with network: sci2audio's own voice download plus the whisper model.
      - name: Fetch the models (skips files already cached)
        shell: bash
        run: uv run python tests/integration/prepare_models.py "$RUNNER_TEMP/test-models/voices" "$RUNNER_TEMP/test-models/whisper"
      - name: Benchmarks (trend only; CI machines vary)
        shell: bash
        env:
          SCI2AUDIO_TEST_MODELS: ${{ runner.temp }}/test-models/voices
        run: uv run pytest -m benchmark --benchmark-only --benchmark-json=benchmark.json
