    directory: /
    schedule:
      interval: weekly
    labels: [chore, "lane:infra"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: [chore, "lane:infra"]
    groups:
      dev-tools:
        dependency-type: development
