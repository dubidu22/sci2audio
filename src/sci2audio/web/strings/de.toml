[privacy]  # jede Aussage hier ist am Code geprüft (D-293)
title = "Datenschutz: Was auf diesem Computer bleibt"
intro = "sci2audio ist ein Programm auf Ihrem Computer, kein Onlinedienst. Diese Seite sagt, was es mit Ihren Dateien macht und wann es das Netz nutzt. Niemand erhält Ihre Daten: weder die Entwickler von sci2audio noch sonst jemand."
local_title = "Nichts verlässt diesen Computer"
local = "sci2audio sendet nichts irgendwohin: keine Telemetrie, keine Nutzungsstatistik, keine Absturzberichte und keine Suche nach Updates, außer Sie schalten sie ein. Es braucht kein Konto und nutzt keinen Onlinedienst. Die Datei lesen, den Text vorbereiten und ihn sprechen geschieht alles auf diesem Computer; auch die Stimme Kokoro läuft hier, und ihren Bibliotheken ist vorgegeben, offline zu bleiben. Installierte Textschritt-Plugins sind Code anderer Leute: siehe unten."
network_title = "Die eine Ausnahme: der Download der Stimme, den Sie starten"
network = "sci2audio nutzt das Netz nur, um die Stimmdateien herunterzuladen, und nur, nachdem Sie auf der Seite der Stimme das Kästchen für Ihr Einverständnis angekreuzt und „Stimme herunterladen“ gedrückt haben. Diese Seite nennt jede Datei mit Größe und Lizenz, bevor etwas geladen wird. Nach dem Download braucht sci2audio kein Netz."
voice_link = "Zur Seite der Stimme"
updates_title = "Die Suche nach Updates, die Sie einschalten können"
updates = "Sie ist aus, bis Sie sie in den Einstellungen einschalten. Dann fragt sci2audio einmal am Tag bei GitHub, wo es veröffentlicht wird, nach der Nummer seiner neuesten Version: eine Anfrage, deren einzige Kennung der Name „sci2audio“ ist, ohne Versionsnummer, ohne Kennnummer und ohne Cookie. GitHub sieht die Internetadresse dieses Computers, wie bei jeder Webseite. sci2audio lädt nichts herunter und installiert nichts; es zeigt einen Link zur Seite der Version."
updates_host = "Die einzige Adresse, die sie fragt:"
plugins_title = "Textschritt-Plugins, die Sie installieren"  # #685
plugins = "Ein Python-Paket, das Sie installieren, kann über den Einstiegspunkt sci2audio.text_steps einen Textschritt hinzufügen, der mitbestimmt, wie sci2audio den Text vorbereitet. Ein solches Plugin ist Code anderer Leute und läuft in sci2audio mit den Rechten des Programms: Es liest den Text jedes Dokuments und schlägt Änderungen vor, die der Bericht aufführt, und wie jedes installierte Python-Paket könnte es das Netz nutzen oder Dateien lesen. sci2audio sperrt Plugins in keine Sandbox und prüft nicht, was sie tun. Der Bericht jedes Auftrags und die Dokumentseite nennen jedes Plugin, mit dem er lief. Plugins werden einmal geladen, wenn sci2audio startet. Die Befehle sci2audio script --no-plugins und sci2audio convert --no-plugins führen einen Auftrag auf der Kommandozeile ohne sie aus, ohne sie überhaupt zu laden; in der Oberfläche schaltet die Deinstallation seines Pakets ein Plugin aus, sobald Sie sci2audio neu starten."
plugins_installed = "Beim Start von sci2audio geladen:"
plugins_problems = "Installiert, aber nicht geladen (sein Code kann beim Versuch, es zu laden, trotzdem gelaufen sein):"
plugins_none = "Es sind keine Textschritt-Plugins installiert."
telemetry_title = "Die Telemetrie des Web-Frameworks ist ausgeschaltet"
telemetry = "Die Oberfläche läuft mit FastAPI, einem Web-Framework, in das OpenTelemetry eingebaut ist, eine Technik, mit der ein Programm aufzeichnet, was es tut. sci2audio schaltet all das in seinem Code aus, und seine Tests prüfen, dass nichts aufgezeichnet wird."
interface_title = "Die Oberfläche ist nur für Sie da"
interface_local = "Ihr Server lauscht nur unter 127.0.0.1, einer Adresse, die nur dieser Computer erreicht, und zwar an einem Port, den das System bei jedem Start von sci2audio neu wählt."
interface_key = "Der Link, den sci2audio im Terminal anzeigt, enthält einen Schlüssel, der bei jedem Start neu ist. Ihr Browser tauscht ihn gegen ein Cookie; ohne den Schlüssel liefert der Server nichts aus."
interface_key_app = "Die Adresse, die die App öffnet, enthält einen Schlüssel, der bei jedem Start neu ist. Das Fenster oder Ihr Browser tauscht ihn gegen ein Cookie; ohne den Schlüssel liefert der Server nichts aus."
interface_pages = "Anfragen von anderen Webseiten werden abgewiesen, und diese Seiten laden nichts aus dem Internet: keine Schriften, Skripte oder Bilder von anderswo."
interface_log = "sci2audio führt kein Protokoll der Anfragen, also landen weder der Schlüssel noch die Namen Ihrer Dateien in einem."
app_log = "Läuft sci2audio als App (nicht als `sci2audio ui`), schreibt es ein kurzes Startprotokoll auf diesem Computer, in {path}: wann es startete und endete, seine Version, wie es die Oberfläche zeigt und, falls es nicht starten konnte, warum; außerdem, wenn eine eingeschaltete Suche nach Updates nicht klappte. Es enthält keine Anfragen, keinen Schlüssel und keine Dateinamen, und nichts schickt es irgendwohin."
files_title = "Wo Ihre Dateien liegen"
files_intro = "sci2audio legt, was es erstellt, an diesen Orten auf diesem Computer ab:"
work_label = "Projektordner"
work = "Ein Ordner für jedes Dokument, das Sie öffnen, benannt nach einem Code aus dem Inhalt der Datei, im Datenordner von sci2audio, den das System nicht aufräumt. Darin: eine Kopie der Datei, ihre Analyse und die gesprochenen Sätze, die für den nächsten Lauf behalten werden (der Sprachzwischenspeicher, den die Seite „Vorbereiten“ des Dokuments leeren kann). Daneben, für die Bibliothek und die Leiste: wann Sie das Dokument zuletzt geöffnet haben (opened.json), Titel und Autoren, die seine Datei nennt (about.json), wo Sie mit dem Hören aufgehört haben (position.json), Ihre Marken, Notizen und Zitate (captures.json) und, aus einer früheren Version, Ihre Markierungen und Notizen (markers.json), die daneben bleiben. Die Bibliothek und die Seite jedes Dokuments können ein Dokument mit all dem entfernen."
output_label = "Hörbuchordner"
output = "Die Hörbücher, ein Ordner für jedes Dokument, benannt nach seiner Datei, in dem Ordner, den Sie wählen. sci2audio ersetzt dort nie Dateien, außer Sie drücken „Diese Dateien ersetzen“. Im Projektordner des Dokuments notiert es, welche Hörbuchdateien es geschrieben hat, mit Größe und Prüfsumme (project.json)."
settings_label = "Einstellungsdatei"
settings = "Ihre Auswahl für das nächste Dokument: Änderungen, Stimme, Tempo und Ordner."
voice_label = "Stimmordner"
voice = "Die Stimmdateien, die Sie heruntergeladen haben, mit dem englischen Sprachmodell, das die Stimme braucht."
remove = "Um ein Dokument zu entfernen, nutzen Sie „Dieses Dokument entfernen“ auf seiner Seite oder in der Bibliothek. Dabei werden auch die Hörbuchdateien gelöscht, die sci2audio in den eigenen Hörbuchordner des Dokuments geschrieben hat und die seitdem unverändert sind, außer Sie kreuzen „Hörbuchdateien behalten“ an; jede andere Datei bleibt, ebenso ein Hörbuch, das erstellt wurde, bevor jedes Dokument einen eigenen Ordner hatte. Um alles zu entfernen, was sci2audio behält, beenden Sie es und löschen Sie die Projektordner, die Einstellungsdatei und den Stimmordner. Ihre Hörbücher bleiben, wo sie sind, bis Sie sie löschen."
cookies_title = "Cookies"
cookies = "sci2audio setzt höchstens sechs Cookies. Sie gehören zur eigenen Adresse dieses Computers, 127.0.0.1, also sendet Ihr Browser sie nie anderswohin: Eines enthält den Schlüssel des aktuellen Starts und gilt nicht mehr, sobald sci2audio beendet ist; die fünf anderen werden nur gesetzt, wenn Sie auf der Seite Einstellungen etwas wählen, und behalten diese Wahl für ein Jahr: die Sprache („en“ oder „de“), die Darstellung („system“, „light“ oder „dark“), ob der gelesene Satz angesagt wird („on“ oder „off“), ob die Tastenkürzel wirken („on“ oder „off“) und ob beim Festhalten ein kurzer Ton erklingt („on“ oder „off“)."
limits_title = "Was sci2audio nicht in der Hand hat"
limits = "Ihr Browser und Ihr Betriebssystem haben eigene Funktionen, etwa Erweiterungen, Synchronisierung oder Rechtschreibprüfung im Netz. sci2audio nutzt sie nicht, kann sie aber auch nicht ausschalten; das geht in deren Einstellungen."
licence_title = "Freie Software"
licence = "sci2audio ist freie Software unter der GNU General Public License, Version 3 oder später. Sein Quellcode ist öffentlich, sodass jeder prüfen kann, was diese Seite sagt."

