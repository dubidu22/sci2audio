[privacy]  # jede Aussage hier ist am Code geprüft (D-293)
title = "Datenschutz: Was auf diesem Computer bleibt"
intro = "sci2audio ist ein Programm auf Ihrem Computer, kein Onlinedienst. Diese Seite sagt, was es mit Ihren Dateien macht und wann es das Netz nutzt. Niemand erhält Ihre Daten: weder die Entwickler von sci2audio noch sonst jemand."
local_title = "Nichts verlässt diesen Computer"
local = "sci2audio sendet nichts irgendwohin: keine Telemetrie, keine Nutzungsstatistik, keine Absturzberichte, keine Suche nach Updates. Es braucht kein Konto und nutzt keinen Onlinedienst. Die Datei lesen, den Text vorbereiten und ihn sprechen geschieht alles auf diesem Computer; auch die Stimme Kokoro läuft hier, und ihren Bibliotheken ist vorgegeben, offline zu bleiben."
network_title = "Die eine Ausnahme: der Download der Stimme, den Sie starten"
network = "sci2audio nutzt das Netz nur, um die Stimmdateien herunterzuladen, und nur, nachdem Sie auf der Seite der Stimme das Kästchen für Ihr Einverständnis angekreuzt und „Stimme herunterladen“ gedrückt haben. Diese Seite nennt jede Datei mit Größe und Lizenz, bevor etwas geladen wird. Nach dem Download braucht sci2audio kein Netz."
voice_link = "Zur Seite der Stimme"
telemetry_title = "Die Telemetrie des Web-Frameworks ist ausgeschaltet"
telemetry = "Die Oberfläche läuft mit FastAPI, einem Web-Framework, in das OpenTelemetry eingebaut ist, eine Technik, mit der ein Programm aufzeichnet, was es tut. sci2audio schaltet all das in seinem Code aus, und seine Tests prüfen, dass nichts aufgezeichnet wird."
interface_title = "Die Oberfläche ist nur für Sie da"
interface_local = "Ihr Server lauscht nur unter 127.0.0.1, einer Adresse, die nur dieser Computer erreicht, und zwar an einem Port, den das System bei jedem Start von sci2audio neu wählt."
interface_key = "Der Link, den sci2audio im Terminal anzeigt, enthält einen Schlüssel, der bei jedem Start neu ist. Ihr Browser tauscht ihn gegen ein Cookie; ohne den Schlüssel liefert der Server nichts aus."
interface_pages = "Anfragen von anderen Webseiten werden abgewiesen, und diese Seiten laden nichts aus dem Internet: keine Schriften, Skripte oder Bilder von anderswo."
interface_log = "sci2audio führt kein Protokoll der Anfragen, also landen weder der Schlüssel noch die Namen Ihrer Dateien in einem."
files_title = "Wo Ihre Dateien liegen"
files_intro = "sci2audio legt, was es erstellt, an diesen Orten auf diesem Computer ab:"
work_label = "Arbeitsordner"
work = "Eine Kopie jeder Datei, die Sie öffnen, ihre Analyse und die gesprochenen Sätze, die für den nächsten Lauf behalten werden (der Sprachzwischenspeicher, den die Seite des Auftrags leeren kann). Die Startseite und die Seite jedes Dokuments können ein Dokument mit all dem entfernen."
output_label = "Hörbuchordner"
output = "Die Hörbücher, in dem Ordner, den Sie wählen. sci2audio ersetzt dort nie Dateien, außer Sie drücken „Diese Dateien ersetzen“."
settings_label = "Einstellungsdatei"
settings = "Ihre Auswahl für das nächste Dokument: Änderungen, Stimme, Tempo und Ordner."
voice_label = "Stimmordner"
voice = "Die Stimmdateien, die Sie heruntergeladen haben, mit dem englischen Sprachmodell, das die Stimme braucht."
remove = "Um ein Dokument zu entfernen, nutzen Sie „Dieses Dokument entfernen“ auf seiner Seite oder auf der Startseite; sein Hörbuch bleibt. Um alles zu entfernen, was sci2audio behält, beenden Sie es und löschen Sie den Arbeitsordner, die Einstellungsdatei und den Stimmordner. Ihre Hörbücher bleiben, wo sie sind, bis Sie sie löschen."
cookies_title = "Cookies"
cookies = "sci2audio setzt höchstens zwei Cookies. Sie gehören zur eigenen Adresse dieses Computers, 127.0.0.1, also sendet Ihr Browser sie nie anderswohin: Eines enthält den Schlüssel des aktuellen Starts und gilt nicht mehr, sobald sci2audio beendet ist; das andere, nur gesetzt, wenn Sie die Sprache umschalten, enthält die gewählte Sprache („en“ oder „de“) für ein Jahr."
limits_title = "Was sci2audio nicht in der Hand hat"
limits = "Ihr Browser und Ihr Betriebssystem haben eigene Funktionen, etwa Erweiterungen, Synchronisierung oder Rechtschreibprüfung im Netz. sci2audio nutzt sie nicht, kann sie aber auch nicht ausschalten; das geht in deren Einstellungen."
licence_title = "Freie Software"
licence = "sci2audio ist freie Software unter der GNU General Public License, Version 3 oder später. Sein Quellcode ist öffentlich, sodass jeder prüfen kann, was diese Seite sagt."
