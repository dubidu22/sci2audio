# Jeder Text der Browser-Oberfläche, Deutsch (D-256, D-289). Exactly the keys and
# placeholders of `en.toml`; a test fails on any difference, and nothing falls back to
# English at run time. The rules of `en.toml`'s header apply (plurals `one`/`other` by
# `{n}`, a no-break space before units, `common.decimal`, ISO dates).
#
# Style (D-292): the formal "Sie" in sentences; buttons and headings as infinitives or
# nouns ("Dokument öffnen"); quotation marks „…“, apostrophe ’, ellipsis …, a spaced en
# dash " – ". Spoken words stay English in v1.0 (D-50) and are not in this table.
#
# Glossary, so later strings stay consistent:
#   audiobook Hörbuch · listening script Hörskript · analysis Analyse · change (edit)
#   Änderung · voice Stimme · job Auftrag · speech cache Sprachzwischenspeicher · page
#   furniture Seitenrahmen · set aside zurückgestellt · switched off ausgeschaltet ·
#   chapter Kapitel · reference list Literaturverzeichnis · folder Ordner · working folder
#   Arbeitsordner · settings Einstellungen · download Download / herunterladen ·
#   preview Hörprobe · read along mitlesen

