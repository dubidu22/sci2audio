[privacy]  # every statement here is checked against the code (D-293)
title = "Privacy: what stays on this computer"
intro = "sci2audio is a program on your computer, not an online service. This page says what it does with your files and when it uses the network. Nobody receives your data: not the makers of sci2audio, nor anyone else."
local_title = "Nothing leaves this computer"
local = "sci2audio sends nothing anywhere: no telemetry, no usage statistics, no crash reports, and no update check unless you turn it on. It needs no account and uses no online service. Reading the file, preparing the text and speaking it all happen on this computer; the Kokoro voice runs here too, with its libraries told to stay offline. Installed text-step plugins are other people’s code: see below."
network_title = "The one exception: the voice download you start"
network = "sci2audio uses the network only to download the voice files, and only after you tick the consent box on the voice page and press “Download the voice”. That page lists every file with its size and licence before anything is fetched. After the download sci2audio needs no network."
voice_link = "Go to the voice page"
updates_title = "The update check you can turn on"
updates = "It is off until you turn it on in Settings. Then sci2audio asks GitHub, where it is published, once a day for the number of its newest version: one request whose only label is the name “sci2audio”, with no version number, no identifier and no cookie. GitHub sees this computer’s internet address, as with any web page. sci2audio downloads and installs nothing; it shows a link to the release page."
updates_host = "The one address it asks:"
plugins_title = "Text-step plugins you install"  # #685
plugins = "A Python package you install can add a text step to how sci2audio prepares the text, through the sci2audio.text_steps entry point. Such a plugin is other people’s code and runs inside sci2audio with the program’s rights: it reads the text of every document and proposes edits, which the report lists, and like any installed Python package it could use the network or read files. sci2audio does not sandbox plugins or check what they do. Each job’s report and the document page name every plugin it ran with. Plugins are loaded once, when sci2audio starts. The commands sci2audio script --no-plugins and sci2audio convert --no-plugins run a command-line job without them, without even loading them; for the interface, uninstalling a plugin’s package and then restarting sci2audio switches it off."
plugins_installed = "Loaded when sci2audio started:"
plugins_problems = "Installed but not loaded (its code may still have run when sci2audio tried to load it):"
plugins_none = "No text-step plugins are installed."
telemetry_title = "The web framework’s telemetry is switched off"
telemetry = "The interface runs on FastAPI, a web framework that comes with OpenTelemetry built in, a way of recording what a program does. sci2audio switches all of it off in its code, and its tests check that nothing is recorded."
interface_title = "The interface is for you only"
interface_local = "Its server listens only on 127.0.0.1, an address that only this computer can reach, on a port the system picks anew each time sci2audio starts."
interface_key = "The link sci2audio shows in the terminal carries a key that is new for each start. Your browser trades it for a cookie; without the key the server serves nothing."
interface_key_app = "The address the app opens carries a key that is new for each start. The window or your browser trades it for a cookie; without the key the server serves nothing."
interface_pages = "Requests from other web pages are refused, and these pages load nothing from the internet: no fonts, scripts or images from elsewhere."
interface_log = "sci2audio keeps no log of requests, so neither the key nor the names of your files are written to one."
app_log = "When sci2audio runs as the app (not as `sci2audio ui`), it writes a short start-up log on this computer, in {path}: when it started and stopped, its version, how it shows the interface and, if it could not start, why; also when an update check you turned on did not work. It holds no requests, no key and no file names, and nothing sends it anywhere."
files_title = "Where your files are"
files_intro = "sci2audio keeps what it makes in these places on this computer:"
work_label = "Project folders"
work = "One folder for each document you open, named by a code made from the file’s contents, in sci2audio’s data folder, which the system does not clean up. In it: a copy of the file, its analysis, and the spoken sentences kept for the next run (the speech cache, which the document’s Prepare page can empty). Beside them, for the library and the rail: when you last opened the document (opened.json), the title and authors its file gives (about.json), where you stopped listening (position.json), your marks, notes and quotes (captures.json) and, from an earlier version, your markers and notes (markers.json), which stay beside them. The library and each document’s page can remove a document with all of this."
output_label = "Audiobook folder"
output = "The audiobooks, one folder for each document, named after its file, in the folder you choose. sci2audio never replaces files there unless you press “Replace these files”. It notes in the document’s project folder which audiobook files it wrote, with their size and a checksum (project.json)."
settings_label = "Settings file"
settings = "Your choices for the next document: changes, voice, speed and folder."
voice_label = "Voice folder"
voice = "The voice files you downloaded, with the English language model the voice needs."
remove = "To remove one document, use “Remove this document” on its page or in the library. It also deletes the audiobook files sci2audio wrote into the document’s own audiobook folder and that are unchanged since, unless you tick “Keep the audiobook files”; any other file stays, and so does an audiobook made before each document had its own folder. To remove everything sci2audio keeps, stop it and delete the project folders, the settings file and the voice folder. Your audiobooks stay where they are until you delete them."
cookies_title = "Cookies"
cookies = "sci2audio sets at most six cookies. They belong to this computer’s own address, 127.0.0.1, so your browser never sends them elsewhere: one holds the key of the current start and stops working when sci2audio stops; the other five are set only when you choose on the Settings page and keep that choice for one year: the language (“en” or “de”), the appearance (“system”, “light” or “dark”), whether the sentence being read is announced (“on” or “off”), whether the keyboard shortcuts work (“on” or “off”) and whether a short sound plays when you capture (“on” or “off”)."
limits_title = "What sci2audio can’t control"
limits = "Your browser and your operating system have features of their own, such as extensions, sync or online spelling checks. sci2audio doesn’t use them, but it can’t switch them off either; their settings can."
licence_title = "Open source"
licence = "sci2audio is free software under the GNU General Public License, version 3 or later. Its source code is public, so anyone can check what this page says."

