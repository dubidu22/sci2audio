# Every string of the browser interface, English (D-256). `de.toml` has exactly the same
# keys and placeholders (D-289); a test fails on any key a template or the script uses that
# is missing here, on any key here that nothing uses, and on any difference between the two
# tables. Placeholders in braces are filled in before the text is escaped for the page.
#
# - A text that depends on a count is a table with `one` and `other`; `one` is used for
#   exactly 1, `other` for any other number, given as `{n}` (D-290).
# - Between a number and its unit stands a no-break space (\u00A0), so they never wrap apart.
# - Numbers use `common.decimal` and no digit grouping. Dates, should one appear, are
#   written as ISO 8601 (2026-11-13) in every language.
# - Spoken words are not here: notices and the preview sentence stay English in v1.0 (D-50).

