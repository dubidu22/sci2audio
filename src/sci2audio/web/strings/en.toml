[privacy]  # every statement here is checked against the code (D-293)
title = "Privacy: what stays on this computer"
intro = "sci2audio is a program on your computer, not an online service. This page says what it does with your files and when it uses the network. Nobody receives your data: not the makers of sci2audio, nor anyone else."
local_title = "Nothing leaves this computer"
local = "sci2audio sends nothing anywhere: no telemetry, no usage statistics, no crash reports, no update check. It needs no account and uses no online service. Reading the file, preparing the text and speaking it all happen on this computer; the Kokoro voice runs here too, with its libraries told to stay offline."
network_title = "The one exception: the voice download you start"
network = "sci2audio uses the network only to download the voice files, and only after you tick the consent box on the voice page and press “Download the voice”. That page lists every file with its size and licence before anything is fetched. After the download sci2audio needs no network."
voice_link = "Go to the voice page"
telemetry_title = "The web framework’s telemetry is switched off"
telemetry = "The interface runs on FastAPI, a web framework that comes with OpenTelemetry built in, a way of recording what a program does. sci2audio switches all of it off in its code, and its tests check that nothing is recorded."
interface_title = "The interface is for you only"
interface_local = "Its server listens only on 127.0.0.1, an address that only this computer can reach, on a port the system picks anew each time sci2audio starts."
interface_key = "The link sci2audio shows in the terminal carries a key that is new for each start. Your browser trades it for a cookie; without the key the server serves nothing."
interface_pages = "Requests from other web pages are refused, and these pages load nothing from the internet: no fonts, scripts or images from elsewhere."
interface_log = "sci2audio keeps no log of requests, so neither the key nor the names of your files are written to one."
files_title = "Where your files are"
files_intro = "sci2audio keeps what it makes in these places on this computer:"
work_label = "Working folder"
work = "A copy of every file you open, its analysis, and the spoken sentences kept for the next run (the speech cache, which the job page can empty). The start page and each document’s page can remove a document with all of this."
output_label = "Audiobook folder"
output = "The audiobooks, in the folder you choose. sci2audio never replaces files there unless you press “Replace these files”."
settings_label = "Settings file"
settings = "Your choices for the next document: changes, voice, speed and folder."
voice_label = "Voice folder"
voice = "The voice files you downloaded, with the English language model the voice needs."
remove = "To remove one document, use “Remove this document” on its page or on the start page; its audiobook stays. To remove everything sci2audio keeps, stop it and delete the working folder, the settings file and the voice folder. Your audiobooks stay where they are until you delete them."
cookies_title = "Cookies"
cookies = "sci2audio sets at most two cookies. They belong to this computer’s own address, 127.0.0.1, so your browser never sends them elsewhere: one holds the key of the current start and stops working when sci2audio stops; the other, set only when you use the language switch, holds the language you chose (“en” or “de”) for one year."
limits_title = "What sci2audio can’t control"
limits = "Your browser and your operating system have features of their own, such as extensions, sync or online spelling checks. sci2audio doesn’t use them, but it can’t switch them off either; their settings can."
licence_title = "Open source"
licence = "sci2audio is free software under the GNU General Public License, version 3 or later. Its source code is public, so anyone can check what this page says."
