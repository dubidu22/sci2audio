# English units, symbols and words read by the `units` step (TP-10, K8; D-236 to D-242).
# Written for sci2audio, GPL-3.0-or-later; no list is copied.
#
# A unit is read in full only after a number (D-236). Every unit is listed as printed, with
# no prefixes combined automatically, so each collision is decided here: "in" (inch), "pm"
# (a time), "a", "y", "pt", "M" (molar or million), "kb" and "Mb" (kilobase or kilobit) and
# "um" are left out on purpose. A unit of one ASCII letter is read only with a space after
# the number ("5 m", not "5m"). Spelling is British, as in the issue (D-238).
#
# Each entry:
#   printed   the forms as printed, compared exactly (case matters: "mg" is not "Mg")
#   singular  read after exactly "1" and in a denominator ("per kilogram")
#   plural    read after any other number (D-237); the same as singular for "kelvin"
#   length    true if a power 2 or 3 reads "square" or "cubic" before it (D-239)
#   per_only  true for a word read as a unit only after "per" or with a negative exponent:
#             "day" in "mg kg⁻¹ day⁻¹" or "mg/kg/day"; "5 day" is left as printed
#   not_before_word  true for a unit that is also an English word: not read before a word in
#             lower case, so a footnote "1 A note." keeps its "A"

[words]
per = "per"
square = "square"
cubic = "cubic"
squared = "squared"
cubed = "cubed"
approximately = "approximately"
about = "about"
times = "times"
# words before a number that make it a label, so a capital letter after it is not a unit
# ("Figure 2 A", "Table 3 C"); compared in lower case
labels = [
    "figure", "fig.", "figs.", "table", "tab.", "section", "sec.", "experiment", "exp.",
    "study", "group", "condition", "phase", "type", "model", "panel", "chapter", "appendix",
    "lemma", "theorem", "equation", "eq.", "line", "row", "step", "case", "part", "item",
    "page", "no.", "number", "class", "level", "stage", "version", "trial", "wave", "set",
    "figures", "tables", "sections", "panels", "experiments", "studies", "groups", "conditions",
    "phases", "types", "chapters", "appendices", "lemmas", "theorems", "equations",
    "eqs.", "lines", "rows", "steps", "cases", "parts", "items", "pages", "nos.", "numbers",
    "classes", "levels", "stages", "versions", "trials", "waves", "sets", "secs.", "tabs.",
    "exps.",
]
# words before a number that make it attributive: "a 1 m pole" (D-237)
articles = ["a", "an"]

# a letter printed against a number for thousand, million or billion: "441K", "15M" (D-241)
[[magnitude]]
printed = ["K", "k"]
reads = "thousand"

[[magnitude]]
printed = ["M"]
reads = "million"

[[magnitude]]
printed = ["B", "bn"]
reads = "billion"

