# German units, symbols and words read by the `units` step (TP-10, #113; D-476, D-480).
# Written for sci2audio, GPL-3.0-or-later; no list is copied.
#
# Same rules and format as en/units.toml (D-236 to D-242), with what German needs on top:
# numbers printed with a decimal comma and a thousands point ("2,5 km", "1.500 m"); "square"
# and "cubic" written into one word ("Quadratmeter"); the plural after every number but a bare
# "1", also in a hyphenated compound ("10-Sekunden-Takt"); and "1" read by the unit's gender
# ("ein Kilogramm", "eine Sekunde"; "nach einer Stunde", "für einen Meter"). The voice's
# front end (espeak-ng German) spells every symbol here: "km" as "ka em", "Std." as "es te de"
# (measured with misaki's espeak-ng German, the front end of the voice of #211; numbers in
# #113). "%" and "€" it reads right after most numbers, but "1 %" as "eins Prozent", so they
# are listed too, with their gender.
#
# Each entry is as in en/units.toml, plus:
#   gender   "m", "f" or "n": the word for "1" before the unit (masculine, feminine, neuter)
#
# Left out on purpose: "kB", "MB", "GB" (the voice says "ge be", as people do, and spells
# "Gigabyte" wrong); "a" (Jahr) and "t" (Tonne), which are also words or variables; "d" (Tag)
# is read only after "pro" or with a negative exponent, since "nach 5 Tagen" needs the
# dative plural.

[words]
per = "pro"
square = "Quadrat"
cubic = "Kubik"
squared = "hoch 2"
cubed = "hoch 3"
approximately = "ungefähr"
about = "etwa"
times = "mal"
decimal = ","
joined_powers = true
hyphen_singular = false
# words before a number that make it a label, so a capital letter after it is not a unit
# ("Abbildung 2 A", "Tabelle 3 C"); compared in lower case
labels = [
    "abbildung", "abb.", "abbildungen", "tabelle", "tab.", "tabellen", "abschnitt", "abschn.",
    "abschnitte", "kapitel", "kap.", "experiment", "experimente", "studie", "studien", "gruppe",
    "gruppen", "bedingung", "bedingungen", "phase", "phasen", "typ", "typen", "modell",
    "modelle", "gleichung", "gl.", "gleichungen", "zeile", "zeilen", "schritt", "schritte",
    "fall", "teil", "teile", "seite", "s.", "seiten", "nr.", "nummer", "klasse", "klassen",
    "stufe", "stufen", "version", "versuch", "welle", "anhang", "anh.", "band", "bd.", "heft",
    "satz", "lemma", "theorem", "panel", "durchgang", "item", "items", "frage", "fragen",
]
# words right before "1" that ask for the dative ("nach einer Stunde", "in einem Meter", "ab
# einem Kilogramm") and the accusative ("für einen Meter"); with a number "über" and "auf"
# mean "more than" and a target: "über eine Million", "auf einen Meter" (review of PR #228);
# anything else reads the nominative
dative = [
    "aus", "bei", "beim", "binnen", "mit", "nach", "seit", "von", "vom", "zu", "zum", "zur",
    "in", "im", "an", "am", "unter", "vor", "hinter", "neben", "zwischen", "ab",
]
accusative = ["für", "durch", "gegen", "ohne", "um", "über", "auf"]
# words that join labels in a list ("Bedingungen 1 bzw. 2 V": no unit after "2"), besides
# ",", "&", a dash, "and" and "or"
label_joins = ["und", "oder", "bzw.", "sowie", "bis"]
# "1" before a unit, by case and the unit's gender (D-480)
[words.one]
nominative = { m = "ein", f = "eine", n = "ein" }
dative = { m = "einem", f = "einer", n = "einem" }
accusative = { m = "einen", f = "eine", n = "ein" }

# millions and the like printed short after a number (as units, so "1 Mio." is "eine Million")
