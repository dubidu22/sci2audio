# sci2audio: reusable project rules for multi-thread Claude execution
# Generated by project-governance-init. Do not edit by hand: change governance-config.json and regenerate.
#
# SCHEMA
#   version:           semver of this ruleset; the minor number goes up whenever a regeneration changes it
#   date:              date of the last generation (YYYY-MM-DD)
#   authority:         precedence order when sources conflict (first wins)
#   project_profile:   project-specific stack, paths, lanes, and CI checks
#   execution_profile: decoupled model routing and token-economy settings
#   <section>:         active rules with id, applies_to, rule

version: 1.14.0
date: 2026-11-23
project: "sci2audio"
repository: "dubidu22/sci2audio"
public_repo: true
owner: "Colin (GitHub dubidu22)"
time_zone_owner: "Europe/Berlin"

authority:
  - owner_messages         # the owner's newest message on a point; one that contradicts this ruleset starts a change through the governance skill, it is not applied silently
  - this_ruleset           # and the project instructions generated from it
  - kb_decision_log        # newest D-entry first
  - pending_kb_batch       # kb/pending-decisions.md: decided, not yet compiled into the decision log
  - project_memory
  - repo_claude_md

project_profile:
  stack_preset: custom
  environment: claude_code
  target_platforms: ["ubuntu-latest", "macos-latest", "windows-latest"]
  fast_checks: "uv run ruff check && uv run ruff format --check && uv run lint-imports && uv run deptry src && uv run pytest -m \"not slow and not benchmark and not browser\"; for a change to the interface also uv run pytest -m browser"
  local_environment: "zsh on macOS (MacBook Pro M4)"
  local_clone_path: "~/Projekte/sci2audio"
  execution_lanes: ["extraction/voices", "layout", "textprep", "app/release", "web", "docs"]
  file_ownership_labels: ["lane:core", "lane:extraction", "lane:layout", "lane:textprep", "lane:voices", "lane:output", "lane:app", "lane:web", "lane:cli", "lane:infra", "lane:docs"]
  lane_mapping_note: "Execution lanes are who works; lane:* labels (.github/lanes.yml) are which files a PR may touch. extraction/voices -> lane:extraction, lane:voices, lane:output. layout -> lane:layout. textprep -> lane:textprep (incl. src/sci2audio/testing). app/release -> lane:app, lane:cli (and lane:web when a PR spans both). web -> lane:web (src/sci2audio/web, static, templates, browser tests). docs -> lane:docs (docs/, CLAUDE.md, KB process text). app and web share files often, so LANE-02 keeps them apart unless their PRs touch disjoint files (D-761 B7/B8). lane:core and lane:infra are shared and critical; lane:infra is the lock. (D-765)"
  critical_paths: ["src/sci2audio/core/**", ".github/**", "pyproject.toml", "uv.lock", "tests/corpus/**", "tests/unit/__snapshots__/**", "tests/regression/**", "THIRD_PARTY_LICENSES.md", "governance/claude-project-rules.yaml", "governance/rules/**", "governance/project_instructions.md", "governance/dispatcher_instructions.md", "governance/project_chat_instructions.md", "governance/claude-md-snippet.md", "governance/governance-config.json", "governance/tools/**", "governance/kb/README.md", "governance/kb/**/adr-*.md", "governance/kb/**/playbook-*.md", "governance/kb/**/doc-*.md"]
  label_paths: ["lane:core=src/sci2audio/core/**", "lane:extraction=src/sci2audio/extraction/**", "lane:layout=src/sci2audio/layout/**", "lane:textprep=src/sci2audio/textprep/**", "lane:textprep=src/sci2audio/testing/**", "lane:voices=src/sci2audio/voices/**", "lane:output=src/sci2audio/output/**", "lane:app=src/sci2audio/app/**", "lane:web=src/sci2audio/web/**", "lane:cli=src/sci2audio/cli.py", "lane:infra=.github/**", "lane:infra=pyproject.toml", "lane:infra=uv.lock", "lane:infra=.pre-commit-config.yaml", "lane:infra=governance/claude-project-rules.yaml", "lane:infra=governance/rules/**", "lane:infra=governance/project_instructions.md", "lane:infra=governance/dispatcher_instructions.md", "lane:infra=governance/project_chat_instructions.md", "lane:infra=governance/claude-md-snippet.md", "lane:infra=governance/governance-config.json", "lane:infra=governance/github-setup/**", "lane:infra=governance/tools/**", "lane:docs=*.md", "lane:docs=docs/**", "lane:docs=docs/design/**", "lane:docs=.claude/**", "lane:docs=governance/kb/**", "lane:docs=governance/plans/**", "lane:docs=governance/ledger/**", "lane:docs=governance/project-state.yaml", "lane:docs=governance/memory/**", "lane:docs=governance/release/**", "lane:docs=governance/workflow-export.md"]
  doc_paths: ["docs/**", "**/README.md", "CHANGELOG.md", "CONTRIBUTING.md", ".github/**", ".claude/**", "governance/dispatcher_instructions.md", "governance/project_chat_instructions.md", "governance/claude-md-snippet.md"]
  governance_paths: ["governance/kb/**", "governance/plans/**", "governance/ledger/**", "governance/project-state.yaml", "governance/memory/**", "governance/release/**", "governance/workflow-export.md"]
  promised_tests_check: "the governance check"
  workspace_root: "./governance"
  state_file: "./governance/project-state.yaml"
  plans_dir: "./governance/plans"
  rules_by_role: "./governance/rules/<role>.yaml"
  default_branch: "main"
  governance_branch: "governance"

execution_profile:
  model_routing:
    coordinator: "Opus 5.5 high"
    specify: "Opus 5.5 high"
    critical_work: "Opus 5.5 high"
    implementation: "Opus 5.5 high"
    review_kb_audit: "Opus 5.5 medium"
    operations: "Sonnet 5.5 high"
    dispatcher: "Opus 5.5 high"
  token_economy:
    profile_name: frugal
    max_concurrent_lanes: 2
    replace_after_prs: 2
    replace_at_compressions: 1
    watchdog_interval_minutes: 120
    watchdog_max_nudges: 3
    non_critical_max_review_rounds: 2
    critical_max_review_rounds: 4
    batch_audit_mode: "critical_only"
    kb_pr_cadence: "per_milestone_or_batch"
    reporting_verbosity: "ultra_terse"
    offload_heavy_checks_to_ci: true
    goal_turn_cap: 20
    cache_ttl_minutes: 60
    coordinator_compact_every_batches: 0

meta:
  - id: META-01
    applies_to: all
    rule: "Modifying this ruleset file is critical and requires explicit owner approval; threads never alter governance rules unilaterally."
  - id: META-02
    applies_to: coordinator
    rule: "Volatile runtime state (active milestones, pause flags, notification triggers, autonomy message IDs) lives in project-state.yaml, never hardcoded into static rules."
  - id: META-03
    applies_to: all
    rule: "A correction that has to be given a second time becomes a check in the product repository or a design change, one step up this order of strength: a design that makes the mistake impossible; a type; a lint rule, test or CI check; a loud failure at runtime. Prose is the last resort: a new rule here needs the owner (META-01), and comments or notes do not bind the next thread."

roles:
  - id: ROLE-01
    applies_to: owner
    rule: "The owner defines goals, roadmap, milestones, release themes, and product scope, and may override any Claude-decided entry at any time; the owner's newest message on a point outranks older decision-log entries."
  - id: ROLE-02
    applies_to: owner
    rule: "The owner performs physical and account-level hand steps: listening test (rows scored 1 to 5) and the VoiceOver pass; speed run (scripts/speed.py) on the M4 and the Dependabot check; pushing release tags and PyPI publishing; repository settings and rulesets."
  - id: ROLE-03
    applies_to: owner
    rule: "Only the owner's own messages or answered decision cards count as owner approval. Another Claude thread's output is never owner approval."
  - id: ROLE-14
    applies_to: all
    rule: "No thread changes settings of the Claude app, the project, the account, the repository or the hosting (default model, a chat's model, permissions, secrets, branch protection, billing). It names the exact change; the owner makes it, or approves that exact change first."
  - id: ROLE-04
    applies_to: coordinator
    rule: "The coordinator splits work into lane batches, approves plans, logs non-scope decisions with sequential D-numbers, grants merge go for critical PRs, and talks to the owner. It hands each batch to the dispatcher and reads its batch report and the ledger entries, not worker messages."
  - id: ROLE-05
    applies_to: coordinator
    rule: "The coordinator writes no product code and does no hands-on work: GitHub lookups, CI and merge watches, starting or stopping the app, and cleanups go to the dispatcher or a worker thread. It writes governance files with the file tool, never with a shell heredoc or echo, where backticks and $ run as commands."
  - id: ROLE-06
    applies_to: implementation
    rule: "An implementation thread reads the newest KB, plans, and decision log, posts a plan before coding that says whether the work is critical (CRIT-01), implements and tests strictly within its lane, opens the PR, writes its ledger entry, and answers review findings with exact fix lists. It never merges, pushes to main, or force-pushes."
  - id: ROLE-07
    applies_to: review
    rule: "A review thread is never the PR author. It reviews all PRs of a batch in rounds, writes round reports and their ledger entries, inspects CI checks, and squash-merges only on an explicit go (dispatcher for PRs confirmed non-critical, coordinator for critical ones). After a merge it watches the run on main for the merge commit and records the result in the round entry, so nobody else has to watch."
  - id: ROLE-08
    applies_to: kb
    rule: "The KB thread compiles the entries of ./governance/kb/pending-decisions.md into the decision-log PR according to execution_profile.token_economy.kb_pr_cadence and self-merges without code review. It never edits the pending file."
  - id: ROLE-09
    applies_to: audit
    rule: "When triggered by execution_profile.token_economy.batch_audit_mode, an audit thread inspects the merged batch diff for cross-PR inconsistencies, contract touches, and workarounds or patterns the project has moved away from that appear in more than one PR (later threads copy what they find), and writes its findings to ./governance/ledger/audits/."
  - id: ROLE-15
    applies_to: audit
    rule: "An audit starts from the output of ./governance/tools/ledger_tool.py flags, not from thread chats. Each flag and each finding gets one verdict: check (a lint rule, test or CI check would have caught it; name it), rule (a rule is wrong or missing; it goes to the owner), split (the plan or PR was too large), owner (needs the owner's decision), or leave (the cost is the work itself; say why). The audit proposes and builds nothing."
  - id: ROLE-12
    applies_to: assist
    rule: "An assist thread walks the owner through one hand step (account, hosting, key or repository settings) one step at a time and checks the result where it can. It never has a secret pasted into chat: secrets go straight into the service that stores them. When the step is done it tells the coordinator the step's title and ends."
  - id: ROLE-17
    applies_to: coordinator
    rule: "Act on few events: a plan or contract to approve, a verdict or gate that needs you (critical, escalated, refused), a blocked or question hand-back, the batch report, and the owner's messages. Everything else ends in the thread it belongs to. Report one line per event, PRs by number only, never their titles, and no list of what is pending: ledger_tool.py status prints that when asked. A dispatcher event reaches you as one line starting with `COORDINATOR:`; its content is in ./governance/plans/batch-<NNN>.md, read it there."
  - id: ROLE-13
    applies_to: coordinator
    rule: "Answer the owner's short questions directly. Keep open hand steps in owner_open_steps in ./governance/project-state.yaml and remove one when its assist thread reports it done; asked what is open, list them by title only. When the owner wants to do one, or an answer needs more than a few lines of instructions, start an assist thread for it instead of walking through it here."
  - id: ROLE-11
    applies_to: dispatcher
    rule: "The dispatcher runs one batch at a time for the coordinator: it starts, fitness-checks, watches and replaces worker threads, keeps ./governance/plans/batch-<NNN>.md current, reads ledger entries but writes none, and grants merge go only for PRs the review thread confirmed non-critical, with green CI and no open must-fix finding. It never approves plans or touches scope, and reports to the coordinator once per batch or on escalation. It also watches CI and merges for PRs outside the batch that the coordinator names, and records them in the batch file."

autonomy:
  - id: AUTO-01
    applies_to: coordinator
    rule: "Coordinator reviews, approves merges, and makes technical/process decisions autonomously until Colin asks to stop, keeping all testing and review gates intact."
  - id: AUTO-02
    applies_to: coordinator
    rule: "Any decision altering product scope, external contracts, or roadmap waits for explicit owner approval."
  - id: AUTO-03
    applies_to: coordinator
    rule: "Work beyond the active milestone may start in unblocked lanes when current milestone work is waiting or complete."

lanes:
  - id: LANE-01
    applies_to: coordinator
    rule: "PRs are batched by execution lane rather than single issues; small follow-ups fold into the lane's next PR."
  - id: LANE-02
    applies_to: dispatcher
    rule: "Concurrent implementation threads must not exceed execution_profile.token_economy.max_concurrent_lanes (at most one active thread per execution lane)."
  - id: LANE-03
    applies_to: implementation
    rule: "A PR modifies files within its mapped file-ownership labels only. Touching shared core files requires lane:infra and acts as a single-threaded lock across lanes. Docs may be updated by any lane."
  - id: LANE-04
    applies_to: coordinator
    rule: "Exception: while a release/X.Y branch is open, one dedicated release thread may run in addition to the lane threads."

threads_and_watchdog:
  - id: THR-01
    applies_to: dispatcher
    rule: "Every new thread reads its extract ./governance/rules/<role>.yaml and then the KB, plans and decision-log entries its task needs, before acting. Before a thread gets a second batch it passes a fitness check: it states its current plan and open items from memory, and the answer is compared with its files; a mismatch means replacement."
  - id: THR-02
    applies_to: all
    rule: "A worker thread (including the KB thread) is replaced once it has handled execution_profile.token_economy.replace_after_prs PRs, counted from its ledger entries, or noticed replace_at_compressions compressions, whichever comes first. It finishes its current atomic step (review round, fix commit, or KB PR) and is replaced at the next hand-off, never mid-step. The coordinator is never replaced."
  - id: THR-03
    applies_to: dispatcher
    rule: "Watchdog: each time you are active, take the time from a tool, never from memory, and for every thread that owes output compare its newest commit or file change with watchdog_interval_minutes. Only when nothing moved: within cache_ttl_minutes nudge it (at most watchdog_max_nudges), after that replace it from its files or escalate to the coordinator. A check while nobody is active needs a scheduled task the owner sets up."
  - id: THR-04
    applies_to: all
    rule: "Threads write plans and round reports under ./governance/plans/ and post one line per hand-off in chat (what was written, where). Fix lists travel through round reports, not through the coordinator. Every file has one writer: a thread writes its own plan, reports and ledger entries and no other thread's; project-state.yaml is the coordinator's. The dispatcher sends the coordinator one line per event, starting with `COORDINATOR:`; the content goes in the batch file."
  - id: THR-05
    applies_to: dispatcher
    rule: "The dispatcher keeps its whole working state in ./governance/plans/batch-<NNN>.md, so it is replaced at its first compression or after one batch, at the next hand-off."
  - id: THR-06
    applies_to: coordinator
    rule: "The coordinator lives for the whole project and keeps its context small: it reads summaries, ledger entries and state files, never diffs, logs, research or whole contracts, and hands lookups to a running thread. At each hand-off it writes state to ./governance/project-state.yaml and new decisions to ./governance/kb/pending-decisions.md, which only it writes, and re-reads them and its rules after any compression."
  - id: THR-10
    applies_to: coordinator,dispatcher
    rule: "Starting a thread: if you have a tool that opens a thread or session, use it and set the model from execution_profile.model_routing there. If you have none, or it cannot set the model, write a starter block (role, model, extract to read, first task, the worktree command of THR-13) and ask the owner to open the chat with that model. A new thread's first line names its role and, if it can see it, its model."
  - id: THR-12
    applies_to: coordinator
    rule: "Before starting a thread the owner will see or has to answer in, post one line here: what it does and what the owner has to do in it. Post one more line when a thread is waiting for the owner. Never start work silently."
  - id: THR-13
    applies_to: all
    rule: "Working files (plans, round reports, ledger entries, batch files, state, pending decisions) live on branch governance: their one writer commits them in a second worktree (git worktree add ../<repo>-governance governance), rebasing before each push, never force-pushing, never on a product branch."
  - id: THR-14
    applies_to: all
    rule: "The ruleset, its config, and the decision log change on main by pull request only, and main holds the copy that counts: a copy on governance that differs from it is not valid. The dispatcher merges main into governance after each such merge."
  - id: THR-07
    applies_to: all
    rule: "A thread silent for longer than execution_profile.token_economy.cache_ttl_minutes pays for its whole history again on its next message. Before such a wait, write a three-line handoff (goal, done, next) into your plan or round report, and under it what you tried and ruled out, with the evidence. Except for the coordinator, work that resumes after the gap goes to a fresh thread started from that handoff."
  - id: THR-08
    applies_to: dispatcher
    rule: "Give related small fixes to the thread that is already warm on that code, back to back, rather than a new thread per fix. Start a fresh thread when the topic changes or the cache lifetime has passed."
  - id: THR-09
    applies_to: all
    rule: "A thread keeps its model and its tool set from first message to last; changing either re-sends the whole history uncached, so work that needs another model goes to another thread. Keep tool output out of the chat: quiet flags, tail -50, or a file read only where it fails; report a check in one line."
  - id: THR-15
    applies_to: implementation,review
    rule: "A worker's report starts with one word: done, question, blocked, review or handoff. It stops only as blocked (two attempts failed for different reasons; finishing would break a rule, name its id; or it needs a destructive git operation, never attempted), question (plan or scope must change) or review (the owner must look). blocked and question carry the evidence and a line Recommended: <one action>, and go in the PR's ledger entry."
  - id: THR-16
    applies_to: coordinator
    rule: "Before composing a batch, run ./governance/tools/ledger_tool.py triage. Every should-fix finding a merged PR left open, and every point a thread set aside, is one entry in ./governance/ledger/deferred/ that you write from the round report, with a decision: fixed (the commit), planned (the issue), postponed (reason and until when) or dropped (the owner's word and the reason). No batch starts while triage reports an open item."

plans_and_criticality:
  - id: PLAN-01
    applies_to: implementation
    rule: "Every implementation thread writes a numbered plan in ./governance/plans/ before writing tests or code. The plan names every test it promises as a pytest node ID, and the PR body repeats that list under the heading '## Tests promised in the plan'; the governance check fails the PR when a listed test does not collect. Deviating from an approved plan requires a new coordinator D-number."
  - id: PLAN-02
    applies_to: coordinator
    rule: "Critical work always waits for explicit coordinator plan approval; non-critical work may proceed immediately when confidence is high."
  - id: CRIT-01
    applies_to: all
    rule: "A change is critical if it touches layer contracts (lint-imports layers, voice plugin contract, text-step interface), core dataclasses (sci2audio.core), KB process, contract or architecture documents (excluding the KB thread's decision-log PR), golden files (corpus truth files, syrupy snapshots, English regression cases), packaging, release and CI workflows, safety mechanisms, licences and third-party content, anything that deletes or overwrites user files, network calls, or carries risk:high."
  - id: CRIT-02
    applies_to: all
    rule: "Critical work requires coordinator plan approval, implementation and review on the critical_work model, exact fix lists, issues for all deferred items, and full multi-platform CI on the final round."
  - id: CRIT-03
    applies_to: review
    rule: "In round 1, decide from the diff whether the PR is critical (CRIT-01), whatever the plan says, and record critical: yes or no in the round report and its ledger entry; in doubt it is critical. A PR found critical without an approved plan stops for the coordinator. A risk:high label set by CI from project_profile.critical_paths is never removed by a thread."

pull_requests_and_reviews:
  - id: PR-01
    applies_to: implementation
    rule: "PR title format: '<area>: <outcome> (#N)'. Closing keywords (Closes #N) belong in the PR body only, never in branch commit messages."
  - id: PR-02
    applies_to: implementation
    rule: "Run local fast checks before opening a PR. A PR enters review only after fast CI is green; critical PRs also require a green full-matrix dispatch first."
  - id: PR-03
    applies_to: implementation
    rule: "Freeze the branch during an active review round except for requested fix commits (one fix commit per round). Never force-push."
  - id: PR-04
    applies_to: implementation,review
    rule: "Where the repository runs pr_checks.py: a file that has to break one of its checks is listed in pr-check-exemptions.json as sanctioned (permanent, with the reason) or debt (with the reason and the issue that removes it), in a PR the owner reviews. Never widen a path glob, drop a label or skip the check to get a PR through; an exemption whose issue is closed is removed."
  - id: PR-05
    applies_to: implementation,review
    rule: "A comment says why the code is as it is, never what it does, what changed or who asked; add no other. The reviewer treats a narrating or change-history comment as a finding (kind narrating-comment). Create no file the rules, the approved plan or the owner did not name: no summary, notes or report files, and new markdown only under project_profile.doc_paths. Reports go in the PR body or the ledger."
  - id: PR-06
    applies_to: review
    rule: "A PR does the task at the size it was asked: a feature, option, abstraction or test the plan does not name is a finding. A new dependency, tool or service needs three lines in the PR body: what it does, what the project already has for that, and the difference that justifies it."
  - id: REV-01
    applies_to: review
    rule: "Non-critical PRs run up to execution_profile.token_economy.non_critical_max_review_rounds rounds; should-fix leftovers are then deferred to issues, must-fix findings never (they stop the PR for the coordinator). Critical PRs run up to round 4, then hit a hard stop requiring owner sign-off."
  - id: REV-02
    applies_to: review
    rule: "Round reports go to ./governance/plans/review-pr<N>-round<K>.md with head SHA, verdict, verified checks, and numbered findings (B/M must-fix, S should-fix, N note); each round also gets a ledger entry (./governance/ledger/README.md). Every finding must be answered as fixed (with test proof), deferred (with issue link), or declined (with reason)."
  - id: REV-05
    applies_to: review
    rule: "A finding is fixed at its root. A code comment, a document or a new rule that explains a workaround is not a fix and leaves the finding open. Name each finding's kind in the round's ledger entry; a kind already seen in an earlier PR is fixed together with a check that stops it from coming back (lint rule, type, test or CI check) or a design change that removes it."
  - id: REV-06
    applies_to: implementation,review
    rule: "A retry, a timeout or deadline, a cache, or a raised limit added to make a failure go away is a workaround until the PR names the cause it removes; the reviewer treats it as a finding (REV-05). A PR that claims to remove a finding kind for good names it in fixes_kinds of its ledger entry. If the kind comes back, ledger_tool.py stats marks the fix regressed and the next fix goes one step up (META-03)."
  - id: MRG-01
    applies_to: review
    rule: "Squash-merge only on an explicit go (dispatcher for PRs confirmed non-critical; for critical ones the coordinator, whose go is the file ./governance/ledger/gos/pr-<N>.yaml with the head SHA, the coordinator and the time, written by the coordinator and required by ledger_tool.py gate <N>), pinned to the reviewed head SHA, with no open B/M finding in the latest round report (ledger_tool.py gate <N> passes) and required CI green (and all target_platforms green for critical PRs). For a risk:high PR, re-run `governance pr checks` on that head after the approving round entry is pushed. If behind main, update via merge commit (never force-push), re-verify diff and CI, record the new SHA as `updated_head` in the latest round entry, and merge on the new SHA."
  - id: MRG-02
    applies_to: coordinator,review
    rule: "Only the owner can let a PR merge that the gate stops, and only once: the coordinator records the owner's reason and the head SHA it is for in ./governance/ledger/overrides/pr-<N>.yaml. The override holds for that head only; a changed PR needs a new decision. It is never turned into a setting or a standing exception. The same reason a second time means the rule itself changes (META-01)."

testing_and_ci:
  - id: TST-01
    applies_to: implementation
    rule: "Tests come first: failing test for bugs, characterisation test before refactoring, and regression test before behaviour changes. Every safety mechanism must have a test that fails without it."
  - id: TST-02
    applies_to: implementation
    rule: "Never weaken, skip, or delete a failing test to turn CI green. Flaky tests without code cause are quarantined same-day with a linked GitHub issue and must be fixed before release."
  - id: VER-02
    applies_to: review,audit
    rule: "A check counts only after it has failed once on a case known to be wrong; until then green proves nothing (pr_checks.py --self-test does this for the pull-request checks). A result that looks too good is a measurement error until shown otherwise. A summary from another thread, a tool or an older note is a claim: check it against the file, the diff or the output before a decision rests on it."
  - id: CI-01
    applies_to: all
    rule: "Fast checks run automatically on PRs; full target_platforms matrix runs on main, release/**, and via explicit full-CI dispatch/label on critical PRs (including critical PRs into release branches). Offload heavy suites to CI actions whenever possible."

github_kb_and_release:
  - id: GH-01
    applies_to: all
    rule: "Every deferred item or flaky test gets a GitHub issue with milestone, lane label, and risk label the same day. Where GraphQL is blocked, use REST API endpoints exclusively."
  - id: KB-01
    applies_to: all
    rule: "All decisions (owner and Claude) are logged sequentially in the KB decision log. An entry that records an owner decision quotes the owner's message and its date; without the quote it ranks as a Claude decision. KB PRs reference code PRs without closing keywords."
  - id: REL-01
    applies_to: all
    rule: "Cut release/X.Y from the release-ready main merge commit. Release fixes land via PR on release/X.Y and port verbatim to main. No quarantined tests may remain at tag time."

hard_invariants_and_owner_prefs:
  - id: INV-01
    applies_to: implementation
    rule: "Licence gate: every new dependency, asset, model, or sample names its licence in the PR body and licence manifest. Banned licences: AGPL, SSPL, non-commercial, unclear. Enforced by: review only."
  - id: INV-02
    applies_to: implementation
    rule: "Architectural layer boundaries are enforced automatically (import-linter (uv run lint-imports; layers cli -> web -> app -> stages -> core)); fix the design, never bypass the contract."
  - id: INV-03
    applies_to: implementation
    rule: "Zero telemetry, analytics, crash uploads, or unrequested network calls. Local web UIs bind strictly to 127.0.0.1. Enforced by: browser tests fail on any request outside the test server (tests/browser/)."
  - id: INV-04
    applies_to: implementation
    rule: "Faithful text: text steps propose marked edits (remove, replace, pause, ask) with a reason; nothing rewrites text silently and nothing summarises (D-57). Enforced by: English regression cases, tests/regression."
  - id: INV-05
    applies_to: implementation
    rule: "Text steps pass the second-run idempotency check, the Hypothesis property tests and the fuzz check; a new skip rule applies to every rule the fuzz check covers (D-699). Enforced by: property and fuzz tests in tests/unit."
  - id: INV-06
    applies_to: implementation
    rule: "A golden file (corpus truth file, syrupy snapshot, English regression case) changes only in a critical PR that explains the diff; made-up fixtures stay separate from corpus golden tests (D-69). Enforced by: critical_paths label risk:high."
  - id: INV-07
    applies_to: implementation
    rule: "Any change that can affect output is judged with the corpus comparison on a local merge of main: every unexpected output file stays byte-identical (D-714). Enforced by: review only."
  - id: INV-08
    applies_to: implementation
    rule: "A branch behind main merges on its own green reviewed head; it is updated with a merge commit only on a conflict or when the PR touches files that changed on main since review, and then merges pinned to the new head after CI (D-760, Colin 18 Nov 2026). A failure that also fails on main does not block a PR; the round report names the main run (D-738). If main goes red, the lane that merged last fixes or reverts before any other PR merges (D-760). Enforced by: CI on main."
  - id: INV-09
    applies_to: implementation
    rule: "A mutation claim in a PR body names the exact command, the test paths and the clean baseline run that passed first; mutants run from a clean worktree (D-676). Enforced by: review only."
  - id: INV-10
    applies_to: implementation
    rule: "A flaky test gets an issue the same day; the 40-run isolation per browser runs through isolate.yml after the same-day quarantine and its result goes into the issue; a found code cause fixes the test and lifts the quarantine; a flaky ZAP scan is re-run once (D-682, D-739, D-602). Enforced by: .github/workflows/isolate.yml."
  - id: INV-11
    applies_to: implementation
    rule: "Every issue carries a milestone, a lane label and, where it applies, risk:high or risk:low; an issue without acceptance criteria is not started, the thread asks the coordinator for them first (D-702, D-738). Enforced by: review only."
  - id: INV-12
    applies_to: implementation
    rule: "The decision log is governance/kb/decision-log.md in this repository (moved from dubidu22/sci2audio-design on 20 Nov 2026); pending decisions collect in governance/kb/pending-decisions.md and the KB thread merges them in one PR per milestone or batch (kb_pr_cadence). A row is 'Decided' when Colin stated or approved it (his words and time quoted) and 'Decided (Claude)' otherwise; a revised older row gets a status note naming the newer entry (D-714). Enforced by: KB thread only."
  - id: INV-13
    applies_to: implementation
    rule: "Release: R1 sets version, CHANGELOG and README on release/X.Y; R2 is the release-day PR with Colin's hand-step results and the changelog date; R3 forward-merges release/X.Y into main after the tag, then the milestone closes. The release-checklist runs (ZAP, nightly, mutation) run on the release branch (D-669, D-714). Enforced by: docs/release-checklist.md."
  - id: PREF-01
    applies_to: all
    rule: "Report times to Colin in Europe/Berlin. Terminal commands for Colin carry no comments inside the code block; explanations go beside it. For a decision the coordinator would otherwise put to Colin, or a real open choice in a critical plan, the coordinator first asks one advisor thread on Fable 5.1 medium effort for a second opinion: it reads only, writes no files, answers once, and the D-entry quotes its verdict."
