# One column throughout, so no column-break sentence; no inline maths in the paper.
[[verbatim]]
where = "plain"
page = 2
text = "Das PrivacyScore-Projekt soll diese Lücke schließen."

[[verbatim]]
# "(etwa Google" ends page 1 above the notes; "Analytics)" opens page 2 under its new head.
where = "page-break"
page = 1
text = "Seitenbetreiber nutzen hier oft kommerzielle Angebote (etwa Google Analytics) anstatt einer lokalen Lösung, die die Privatheitsinteressen der Besucherinnen besser berücksichtigt (z. B. Piwik)."

[[verbatim]]
# "ins-besondere" is split across lines.
where = "hyphenation"
page = 2
text = "Die Entscheidungen der Betreiber sind dabei für Besucherinnen oft intransparent, insbesondere bei komplexeren Diensten wie dem Schutz gegen Denial-of-Service-Angriffe."

[[verbatim]]
# The mark 7 of the note on securityheaders.io follows the full stop.
where = "footnote-mark"
page = 2
text = "Darüber hinaus existieren Dienste, welche das Vorhandensein der relativ neuen HTTP-Security-Header überprüfen.7"

[[verbatim]]
where = "plain"
page = 6
text = "Wie viele andere Sicherheitswerkzeuge auch ist PrivacyScore demnach ein Dual-Use-Werkzeug."

[[verbatim]]
# "herzustellen" ends page 12; "und Öffentlichkeit" opens page 13 under its head.
where = "page-break"
page = 12
text = "Das Ziel des PrivacyScore-Projekts besteht darin, Transparenz herzustellen und Öffentlichkeit zu generieren."
