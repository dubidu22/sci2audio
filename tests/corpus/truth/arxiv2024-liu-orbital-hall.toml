[[verbatim]]
where = "plain"
page = 1
text = "We find that, in doped systems, extrinsic effects associated with the Fermi surface (skew scattering and side jump) provide ≈ 95% of the OHE."

[[verbatim]]
# "nee-dle" is split across lines. "Øersted" is printed so (source: \O{}ersted).
where = "hyphenation"
page = 1
text = "The electrical manipulation of magnetic degrees of freedom has been continuously investigated since Øersted discovered the deflection of a compass needle by a current-carrying wire."

[[verbatim]]
where = "page-break"
page = 3
text = "In the spin Hall effect disorder corrections cancel the intrinsic contribution altogether, while in the anomalous Hall effect they overwhelm the intrinsic contribution by a factor of 7 [52, 58]."

[[verbatim]]
where = "column-break"
page = 4
text = "For a more generic disorder model, although we do not expect the results to change qualitatively, the RHS of Eqs. (6) and (7) will depend on the angular characteristics of the scattering potential."
