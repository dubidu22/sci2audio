[[verbatim]]
where = "plain"
page = 1
text = "This work explores the hypothesis that subjectively attributed meaning constitutes the phenomenal content of conscious experience."

[[verbatim]]
# "seman-" ends page 3 above footnote 1; "tics [40]" opens page 4.
where = "page-break"
page = 3
text = "Fortunately, seminal works in the philosophy of mind and language [52] (see also [48, 135]), as well as mathematical advances in natural language semantics [40] equip us with the right conceptual groundwork for formalizing subjective meaning with regard to the problem of consciousness."

[[verbatim]]
# "mean-ing" is split across lines inside the boxed proposition.
where = "hyphenation"
page = 4
text = "We hypothesize a notion of subjectively attributed meaning or subjective meaning as an inherent feature of the qualia of consciousness."

[[verbatim]]
where = "plain"
page = 18
text = "This work posits that subjectively attributed meaning is ubiquitous in conscious experiences."
