# Ground truth for papers/acl2023-hardt-ellipsis.pdf. Format: README.md.
file = "papers/acl2023-hardt-ellipsis.pdf"
drafted_from = ["pdf"]  # ACL Anthology: no author source online
title = "Ellipsis-Dependent Reasoning: a New Challenge for Large Language Models"

pages = 9
# Pages 1-7 two columns (page 7 holds Table 3 and A.2 in the left column only).
# Pages 8-9 are the one-column ACL 2023 Responsible NLP Checklist.
columns = [2, 2, 2, 2, 2, 2, 2, 1, 1]

# The checklist is printed in the paper, so it is read. Its section letters are printed
# with a tick box between letter and text ("B ☑ Did you ..."); the box is left out here.
headings = [
  { level = 1, text = "Abstract" },
  { level = 1, text = "1 Introduction" },
  { level = 1, text = "2 Related Work" },
  { level = 2, text = "2.1 Probing Models for Knowledge" },
  { level = 2, text = "2.2 Anaphora and Question Answering" },
  { level = 2, text = "2.3 Ellipsis as a Task" },
  { level = 2, text = "2.4 Relevance for Ellipsis-Dependent Reasoning" },
  { level = 1, text = "3 Data" },
  { level = 1, text = "4 Test" },
  { level = 1, text = "5 Results" },
  { level = 1, text = "6 Analysis" },
  { level = 1, text = "7 Conclusion" },
  { level = 1, text = "8 Limitations" },
  { level = 1, text = "References" },
  { level = 1, text = "A Appendix" },
  { level = 2, text = "A.1 Sample Instantiations" },
  { level = 3, text = "Single Sentence" },
  { level = 3, text = "Two Actions" },
  { level = 2, text = "A.2 Substitutions" },
  { level = 1, text = "ACL 2023 Responsible NLP Checklist" },
  { level = 2, text = "A For every submission:" },
  { level = 2, text = "B Did you use or create scientific artifacts?" },
  { level = 2, text = "C Did you run computational experiments?" },
  { level = 2, text = "D Did you use human annotators (e.g., crowdworkers) or research with human participants?" },
]

