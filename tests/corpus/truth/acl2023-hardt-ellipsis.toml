[counts]
# Footnote 1 on page 3, plus the unmarked note under the checklist on page 8.
footnotes = 2
tables = 3  # Tables 1 and 2 on page 3, Table 3 on page 7
figures = 8  # bar charts, Figures 1-8 on pages 4 and 5
numbered_formulas = 0  # (1)-(4) on page 1 are numbered language examples, not formulas
unnumbered_formulas = 0

[[verbatim]]
where = "hyphenation"
page = 1
text = "We define several structures of paired examples, where an ellipsis example is matched to its non-ellipsis counterpart, and a question is posed which requires resolution of the ellipsis."

[[verbatim]]
# Also splits "dis-course" across lines.
where = "column-break"
page = 1
text = "As with pronominal anaphora and other discourse processes, there is great flexibility in the way ellipsis can occur in discourse."

[[verbatim]]
# "Sep-" ends page 2; "arate" follows Tables 1 and 2 on page 3.
where = "page-break"
page = 2
text = "The first two structures, Separate Sentence, and Conjoined Sentence, involve two adjacent main clauses."

[[verbatim]]
where = "plain"
page = 4
text = "Most of the current rapid progress in NLP is due to pre-trained large language models."
