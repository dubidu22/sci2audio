[[verbatim]]
where = "plain"
page = 1
text = "PyMedPhys is an open-source medical physics library built for Python by a diverse community that values and prioritizes code sharing, review, continuous improvement, and peer development."

[[verbatim]]
# The sidebar's licence lines sit level with this sentence; they must not get into it.
where = "plain"
page = 1
text = "This is particularly true in the field of radiation oncology, where the implementation of increasingly sophisticated technologies requires increasingly complex processes to maintain the improving standard of care."

[[verbatim]]
where = "page-break"
page = 1
text = "These solutions can be broadly categorised in two areas: data extraction/conversion of proprietary formats from a variety of radiotherapy systems, and manipulation of standard radiotherapy data to perform quality assurance (QA) tasks that are otherwise time-consuming or lack commercial solutions with the desired flexibility or true function."
