[[verbatim]]
# Splits "un-derstanding" and "bet-ter" across lines.
where = "hyphenation"
page = 1
text = "Natural language understanding (NLU) technologies can support individuals and practitioners to understand better privacy practices described in lengthy and complex documents."

[[verbatim]]
# Footnote ∗ sits between the two columns in storage order.
where = "column-break"
page = 1
text = "Various natural language understanding (NLU) technologies have recently been developed to understand privacy policies (Wilson et al., 2016a; Harkous et al., 2018; Ravichander et al., 2019; Ahmad et al., 2020; Parvez et al., 2022; Ahmad et al., 2021; Bui et al., 2021)."

[[verbatim]]
# A long list sentence: fragment. Page 2 opens with Table 1 before the text goes on.
where = "page-break"
page = 1
text = "(1) usefulness: the selected tasks can help practitioners in the domain quickly understand privacy practices without reading the whole privacy policy;"

[[verbatim]]
# Subscripts BASE and LARGE, set in small capitals, follow "RoBERTa" with no space.
# "pre-train" is really hyphenated, broken after "pre-".
where = "inline-maths"
page = 3
text = "Since PP-RoBERTaBASE performs the best among all base models, we also continue pre-train RoBERTaLARGE (PP-RoBERTaLARGE)."

[[verbatim]]
where = "plain"
page = 5
text = "This work focuses on the English language only, and the findings may not apply to other languages."

[[verbatim]]
# Footnote mark 3 right after the full stop.
where = "footnote-mark"
page = 5
