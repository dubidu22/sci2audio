[[verbatim]]
# Splits "un-derstanding" and "bet-ter" across lines.
where = "hyphenation"
page = 1
text = "Natural language understanding (NLU) technologies can support individuals and practitioners to understand better privacy practices described in lengthy and complex documents."

[[verbatim]]
# Footnote ∗ sits between the two columns in storage order.
where = "column-break"
page = 1
text = "Various natural language understanding (NLU) technologies have recently been developed to understand privacy policies (Wilson et al., 2016a; Harkous et al., 2018; Ravichander et al., 2019; Ahmad et al., 2020; Parvez et al., 2022; Ahmad et al., 2021; Bui et al., 2021)."

[[verbatim]]
# A long list sentence: fragment. Page 2 opens with Table 1 before the text goes on.
