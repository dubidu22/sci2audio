]
expected = [
    "At T equals 10 to the power of 4 kelvin the gas is hot.",
    "10 to the power of 3 kelvin and 10 to the power of 6 M stars.",
    "It grows as 10 to the power of 4 in the limit, as 2⁸ and 10 to the power of minus 3 seconds do.",
]

