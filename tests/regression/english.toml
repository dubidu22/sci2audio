expected = ["Children aged 0–6 years were included, that is, preschoolers and toddlers, for example, in day-care (Figure 1). Dr. Smith compared them vs. controls (see Table 2). Approximately half were girls."]
utterances = [
    "Children aged 0–6 years were included, that is, preschoolers and toddlers, for example, in day-care (Figure 1).",
    "Dr. Smith compared them vs. controls (see Table 2).",
    "Approximately half were girls.",
]

