blocks = [{ kind = "paragraph", text = "Doses of 3.5 mg/kg were given at 37 °C." }]
expected = ["Doses of 3.5 mg/kg were given at 37 °C."]

[[case]]
id = "abbreviations"
audit = 9
issue = 68
goal = "'i.e.', 'e.g.', 'vs.', 'Dr.', 'Fig.' and 'Approx.' read in full; 'Table 2' kept; the word after 'Approx.' not capitalised (TP-08)."
blocks = [{ kind = "paragraph", text = "Children aged 0–6 years were included, i.e., preschoolers and toddlers, e.g., in day-care (Fig. 1). Dr. Smith compared them vs. controls (see Table 2). Approx. half were girls." }]
expected = ["Children aged 0 to 6 years were included, i.e., preschoolers and toddlers, e.g., in day-care (Fig. 1). Dr. Smith compared them vs. controls (see Table 2). Approx. half were girls."]
utterances = [
    "Children aged 0 to 6 years were included, i.e., preschoolers and toddlers, e.g., in day-care (Fig. 1).",
    "Dr. Smith compared them vs. controls (see Table 2).",
    "Approx. half were girls.",
]

[[case]]
