issue = 576
goal = "Raised digits glued after a number are its exponent, before a magnitude letter or not: '10⁴K' is ten thousand kelvin, never '104 thousand'. The K reads 'kelvin' as it does in '10⁴ K'; an M that is no unit is set apart, since after a power it is no 'million'."
