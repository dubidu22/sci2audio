id = "abbreviations-latin"
audit = 0
issue = 68
goal = "'e.g.', 'i.e.', 'cf.' and 'viz.' read in full, a capital kept at a sentence start (TP-08, D-230)."
blocks = [{ kind = "paragraph", text = "E.g., the first model, i.e. the baseline, did worse; cf. the second, viz. the large one." }]
expected = ["For example, the first model, that is the baseline, did worse; compare the second, namely the large one."]

