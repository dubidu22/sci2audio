blocks = [{ kind = "paragraph", text = "Doses of 3.5 mg/kg were given at 37 °C." }]
expected = ["Doses of 3.5 milligrams per kilogram were given at 37 degrees Celsius."]

[[case]]
id = "abbreviations"
