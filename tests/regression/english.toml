    { kind = "table", text = "Group n Mean\nA 12 3.4\nB 15 2.9" },
    { kind = "paragraph", text = "Group A scored higher." },
]
expected = ["Table 2: Mean scores by group.", "Table 2 is skipped.", "Group A scored higher."]

