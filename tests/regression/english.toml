# English regression cases (#4, PE-03): input blocks and the script the built-in text steps
# produce for them, one line per block that is read. Format: sci2audio.testing.regression.
#
# The first 14 cases are the 14 rows of the English audit (KB
# 02-product-and-pipeline/audit-english-rules-vs-spacy-2026-11-09.md §4). Their text comes
# from the audit's sample, which was written for that test (tools/english_check/sample_en.md,
# project-owned, no third-party text):
# - verbatim sentences of the sample: author-year-citations, numeric-citations,
#   url-and-e-mail, line-end-hyphens, units, running-footer;
# - adapted from the sample, so that each case tests one rule (words left out or added, such
#   as "Dr. Smith compared them vs. controls"): ligature, symbols, statistics, abbreviations,
#   large-number, roman-numerals, acronyms, homographs.
# Line-end hyphens are written as layout gives them: a hyphen, then a line break (the sample
# prints "develop- ment").
#
# `utterances`, where given, is how the cutter cuts the script into what the voice says in
# one call each (sentence ends after abbreviations, D-115).
#
# `expected` is the script TODAY. A rule PR changes `expected` of the cases its rule touches
# before it changes the rule, and the PR shows the diff. `goal` notes what the owning issue's
# rule must reach; the wording is that issue's decision.

[[case]]
id = "author-year-citations"
audit = 1
issue = 66
goal = "Removed, or read as a short note without 'et al.' spelled out (TP-03, TP-04)."
blocks = [{ kind = "paragraph", text = "Several studies have examined the effects of environmental noise on young children (Smith et al., 2019; Jones & Lee, 2020)." }]
expected = ["Several studies have examined the effects of environmental noise on young children (Smith et al., 2019; Jones & Lee, 2020)."]

[[case]]
id = "numeric-citations"
audit = 2
issue = 66
goal = "The bracketed citation, ranges and lists included, removed with no space left before the full stop (TP-03)."
blocks = [{ kind = "paragraph", text = "However, findings remain inconsistent [2–6, 16, 17]." }]
expected = ["However, findings remain inconsistent [2–6, 16, 17]."]

[[case]]
id = "url-and-e-mail"
audit = 3
issue = 66
goal = "URLs, the DOI link and the e-mail address removed and the sentences repaired: no 'available at and.' or 'Contact:.' (TP-07)."
blocks = [{ kind = "paragraph", text = "Data are available at https://doi.org/10.1007/s10578-016-0626-7 and www.example.org/data. Contact: j.doe@uni-example.edu." }]
expected = ["Data are available at https://doi.org/10.1007/s10578-016-0626-7 and www.example.org/data. Contact: j.doe@uni-example.edu."]
utterances = [
    "Data are available at https://doi.org/10.1007/s10578-016-0626-7 and www.example.org/data.",
    "Contact: j.doe@uni-example.edu.",
]

[[case]]
id = "line-end-hyphens"
audit = 4
issue = 65
goal = "Joined where the joined word is a word: 'development', 'difficulties', 'processing' (TP-02)."
blocks = [{ kind = "paragraph", text = "Exposure to trauma may interfere with infants' normal develop-\nment and cause diffi-\nculties in emotional pro-\ncessing." }]
expected = ["Exposure to trauma may interfere with infants' normal develop- ment and cause diffi- culties in emotional pro- cessing."]

[[case]]
id = "ligature"
audit = 5
issue = 65
goal = "The ligature read as its letters: 'Androff' (IN-04)."
blocks = [{ kind = "paragraph", text = "Dr. Androﬀ notes that the effect was small." }]
expected = ["Dr. Androﬀ notes that the effect was small."]

[[case]]
id = "symbols"
audit = 6
issue = 68
goal = "'≥ 18' read 'greater than or equal to 18' and '± 12%' read 'plus or minus 12 percent'; the digits stay for misaki (TP-10)."
blocks = [{ kind = "paragraph", text = "Participants (± 12%) were enrolled vs. 980 controls ≥ 18 years." }]
expected = ["Participants (± 12%) were enrolled vs. 980 controls ≥ 18 years."]

[[case]]
id = "statistics"
audit = 7
issue = 67
goal = "'n = 35' read 'n equals 35', 'p < .05' read 'p less than point zero five', 'CI' read 'confidence interval' (TP-11)."
blocks = [{ kind = "paragraph", text = "A total of n = 35 studies met the criteria. The mean age was M = 4.2 (SD = 1.1) years; the effect was significant (p < .05, 95% CI [1.2, 3.4])." }]
expected = ["A total of n = 35 studies met the criteria. The mean age was M = 4.2 (SD = 1.1) years; the effect was significant (p < .05, 95% CI [1.2, 3.4])."]
utterances = [
    "A total of n = 35 studies met the criteria.",
    "The mean age was M = 4.2 (SD = 1.1) years; the effect was significant (p < .05, 95% CI [1.2, 3.4]).",
]

[[case]]
id = "units"
audit = 8
issue = 68
goal = "'3.5 mg/kg' read 'milligrams per kilogram' and '37 °C' read 'degrees Celsius' (TP-10)."
blocks = [{ kind = "paragraph", text = "Doses of 3.5 mg/kg were given at 37 °C." }]
expected = ["Doses of 3.5 mg/kg were given at 37 °C."]

[[case]]
id = "abbreviations"
audit = 9
issue = 68
goal = "'i.e.', 'e.g.', 'vs.', 'Dr.', 'Fig.' and 'Approx.' read in full; 'Table 2' kept; the word after 'Approx.' not capitalised (TP-08)."
blocks = [{ kind = "paragraph", text = "Children aged 0–6 years were included, i.e., preschoolers and toddlers, e.g., in day-care (Fig. 1). Dr. Smith compared them vs. controls (see Table 2). Approx. half were girls." }]
expected = ["Children aged 0–6 years were included, i.e., preschoolers and toddlers, e.g., in day-care (Fig. 1). Dr. Smith compared them vs. controls (see Table 2). Approx. half were girls."]
utterances = [
    "Children aged 0–6 years were included, i.e., preschoolers and toddlers, e.g., in day-care (Fig. 1).",
    "Dr. Smith compared them vs. controls (see Table 2).",
    "Approx. half were girls.",
]

[[case]]
id = "large-number"
audit = 10
issue = 67
goal = "'1,234' left as a number for misaki ('one thousand two hundred thirty-four'), never read as a year (TP-09)."
blocks = [{ kind = "paragraph", text = "Approx. 1,234 participants were enrolled." }]
expected = ["Approx. 1,234 participants were enrolled."]

[[case]]
id = "roman-numerals"
audit = 11
issue = 67
goal = "'World War II' read 'World War Two', 'Phase III' read 'Phase three' (TP-13, a Should; #67 decides whether v1.0 covers it)."
blocks = [{ kind = "paragraph", text = "During World War II and in Phase III trials, parents kept diaries." }]
expected = ["During World War II and in Phase III trials, parents kept diaries."]

[[case]]
id = "acronyms"
audit = 12
issue = 18
goal = "Left unchanged: misaki spells PTSD, ADHD and CBCL letter by letter (D-54)."
blocks = [{ kind = "paragraph", text = "PTSD and ADHD were assessed with the CBCL." }]
expected = ["PTSD and ADHD were assessed with the CBCL."]

[[case]]
id = "homographs"
audit = 13
issue = 18
goal = "Left unchanged: misaki picks the pronunciation of 'read', 'record', 'wound' and 'lead' (D-54, TP-14)."
blocks = [{ kind = "paragraph", text = "Parents read the record aloud; they now record the data and read it again. The bandage was wound around the wound. Lead exposure may lead to deficits." }]
expected = ["Parents read the record aloud; they now record the data and read it again. The bandage was wound around the wound. Lead exposure may lead to deficits."]
utterances = [
    "Parents read the record aloud; they now record the data and read it again.",
    "The bandage was wound around the wound.",
    "Lead exposure may lead to deficits.",
]

[[case]]
id = "running-footer"
audit = 14
issue = 63
goal = "The journal footer layout marks as furniture is not read (TP-01)."
blocks = [
    { kind = "paragraph", text = "The bandage was wound around the wound." },
    { kind = "furniture", role = "running-head", text = "Child Psychiatry Hum Dev (2016) 47:950–965 951" },
]
expected = ["The bandage was wound around the wound."]

# Formulas, tables, figures, footnotes and the reference list (#64, D-142 to D-148). Texts
# written for these cases.

[[case]]
id = "table-with-caption-above"
audit = 0
issue = 64
goal = "The table is replaced by one short notice named by its caption's label; the caption reads as printed in its place (FX-02, Q3)."
blocks = [
    { kind = "caption", text = "Table 2: Mean scores by group.", label = "Table 2", describes = 1 },
    { kind = "table", text = "Group n Mean\nA 12 3.4\nB 15 2.9" },
    { kind = "paragraph", text = "Group A scored higher." },
]
expected = ["Table 2: Mean scores by group.", "Table 2 is skipped.", "Group A scored higher."]

[[case]]
id = "figure-without-caption"
audit = 0
issue = 64
goal = "A figure with no caption gets the unnamed notice (FX-02, Q3)."
blocks = [
    { kind = "paragraph", text = "The setup is drawn below." },
    { kind = "figure", text = "" },
]
expected = ["The setup is drawn below.", "A figure is skipped."]

[[case]]
id = "figure-abbreviated-label"
audit = 0
issue = 64
goal = "A caption label printed as 'Fig. 3' names the figure in full: 'Figure 3 is skipped.' (Q3, D-145)."
blocks = [
    { kind = "figure", text = "0 10 20\ntime (s)" },
    { kind = "caption", text = "Fig. 3. Response over time.", label = "Fig. 3", describes = 0 },
]
expected = ["Figure 3 is skipped.", "Fig. 3. Response over time."]

[[case]]
id = "figure-label-in-capitals"
audit = 0
issue = 64
goal = "A short label printed in capitals or against its number ('FIG. 3', 'Fig.4') names the figure in full (Q3, D-145)."
blocks = [
    { kind = "figure", text = "0 10 20" },
    { kind = "caption", text = "FIG. 3. Response over time.", label = "FIG. 3", describes = 0 },
    { kind = "figure", text = "0 5" },
    { kind = "caption", text = "Fig.4 Response at rest.", label = "Fig.4", describes = 2 },
]
expected = ["Figure 3 is skipped.", "FIG. 3. Response over time.", "Figure 4 is skipped.", "Fig.4 Response at rest."]

[[case]]
id = "figure-with-two-captions"
audit = 0
issue = 64
goal = "A placeholder named by several captions names them all, joined with 'and' (Q3, D-145)."
blocks = [
    { kind = "caption", text = "Algorithm 1 The first pass.", label = "Algorithm 1", describes = 1 },
    { kind = "figure", text = "1: for each item do\n2: count it" },
    { kind = "caption", text = "Figure 1: Both passes.", label = "Figure 1", describes = 1 },
]
expected = ["Algorithm 1 The first pass.", "Algorithm 1 and Figure 1 are skipped.", "Figure 1: Both passes."]

[[case]]
id = "numbered-formula"
audit = 0
issue = 64
goal = "A display formula is replaced by a notice with its printed number (FX-01, D-55, Q3)."
blocks = [
    { kind = "paragraph", text = "The energy is" },
    { kind = "formula", text = "E = mc2 (4)", label = "4" },
    { kind = "paragraph", text = "where c is the speed of light." },
]
expected = ["The energy is", "Formula 4 is skipped.", "where c is the speed of light."]

[[case]]
id = "unnumbered-formula"
audit = 0
issue = 64
goal = "A display formula without a number: 'A formula is skipped.' (FX-01, Q3)."
blocks = [{ kind = "formula", text = "x = a + b" }]
expected = ["A formula is skipped."]

[[case]]
id = "footnote-with-superscript-mark"
audit = 0
issue = 64
goal = "The mark leaves the running text; the note is read where layout placed it, introduced by its mark (TP-05, Q2, D-143, D-144)."
blocks = [
    { kind = "paragraph", runs = ["The effect was small.", { sup = "1" }, " It held in both groups."] },
    { kind = "footnote", text = "1 Measured with the short form.", label = "1" },
]
expected = ["The effect was small. It held in both groups.", "Footnote 1. Measured with the short form."]

[[case]]
id = "footnote-with-symbol-mark"
audit = 0
issue = 64
goal = "A note marked by a symbol is introduced without the symbol (D-144)."
blocks = [
    { kind = "paragraph", runs = ["Jane Doe", { sup = "∗" }] },
    { kind = "footnote", text = "∗Work done while at the institute.", label = "∗" },
]
expected = ["Jane Doe", "Footnote. Work done while at the institute."]

[[case]]
id = "footnote-without-mark"
audit = 0
issue = 64
goal = "A note printed without a mark is still introduced (D-144)."
blocks = [{ kind = "footnote", text = "The checklist is adopted from an earlier one." }]
expected = ["Footnote. The checklist is adopted from an earlier one."]

[[case]]
id = "footnote-numbered-with-a-point"
audit = 0
issue = 64
goal = "A note printed '1. Text' or '2) Text' reads 'Footnote 1. Text': the point or parenthesis after the mark is not read (D-144)."
blocks = [
    { kind = "footnote", text = "1. Measured twice.", label = "1" },
    { kind = "footnote", text = "2) Measured once.", label = "2" },
]
expected = ["Footnote 1. Measured twice.", "Footnote 2. Measured once."]

[[case]]
id = "maths-exponent-is-not-a-mark"
audit = 0
issue = 64
goal = "A superscript after a one-letter variable is maths, not a footnote mark, even when a note on the page has that label (D-143)."
blocks = [
    { kind = "paragraph", runs = ["It runs in time N", { sup = "3" }, " on dense grammars."] },
    { kind = "footnote", text = "3 Sparse ones are faster.", label = "3" },
]
expected = ["It runs in time N3 on dense grammars.", "Footnote 3. Sparse ones are faster."]

[[case]]
id = "reference-list"
audit = 0
issue = 64
goal = "The reference list section, its heading included, is not read; the appendix after it is (TP-06, D-146)."
blocks = [
    { kind = "heading", text = "6 Conclusion", label = "6" },
    { kind = "paragraph", text = "The method works." },
    { kind = "heading", text = "References" },
    { kind = "paragraph", text = "Doe, J. (2020). A first study. Journal of Examples 1, 1–9." },
    { kind = "paragraph", text = "Roe, R. (2021). A second study. Journal of Examples 2, 10–19." },
    { kind = "heading", text = "A Appendix", label = "A" },
    { kind = "paragraph", text = "More results." },
]
sections = [
    { title = "6 Conclusion", level = 1, start = 0, end = 2 },
    { title = "References", level = 1, start = 2, end = 5 },
    { title = "A Appendix", level = 1, start = 5, end = 7 },
]
expected = ["6 Conclusion", "The method works.", "A Appendix", "More results."]

[[case]]
id = "numbered-bibliography"
audit = 0
issue = 64
goal = "A numbered 'Bibliography' section is a reference list too (TP-06, D-83, D-146)."
blocks = [
    { kind = "heading", text = "7 Bibliography", label = "7" },
    { kind = "paragraph", text = "[1] Doe, J. A first study. 2020." },
]
sections = [{ title = "7 Bibliography", level = 1, start = 0, end = 2 }]
expected = []
