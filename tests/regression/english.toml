# Footnote marks tied to their notes by link tags (#189, D-420 to D-428). The first case is
# the corpus Markdown sample's text (CC0, written for sci2audio); the second is The Time
# Machine's one endnote and the sentence that marks it, from the corpus EPUB (public domain,
# tests/corpus/LICENSES.md), with the tags extraction gives them.
[[case]]
id = "linked-marks-markdown"
audit = 0
issue = 189
goal = "A noteref mark whose link reaches a note is left out wherever it stands, each time it is used, and the note is introduced by its first mark (D-421, D-425, D-428)."
blocks = [
    { kind = "paragraph", runs = ["Every sentence here is our own.", { text = "1", tags = ["p", "sup", "a", "#fnref1", "role:doc-noteref", "link:b3l0"] }] },
    { kind = "list_item", runs = ["Do footnotes", { text = "2", tags = ["ol", "li", "sup", "a", "#fnref2", "role:doc-noteref", "link:b4l0"] }, " help or hurt?"] },
    { kind = "paragraph", runs = ["Listeners kept up.", { text = "2", tags = ["p", "sup", "a", "#fnref2:1", "role:doc-noteref", "link:b4l0"] }] },
    { kind = "footnote", text = "Nothing in this note is taken from anyone else." },
    { kind = "footnote", text = "A footnote with bold text, continued on a second line." },
]
expected = [
    "Every sentence here is our own.",
    "Do footnotes help or hurt?",
    "Listeners kept up.",
    "Footnote 1. Nothing in this note is taken from anyone else.",
    "Footnote 2. A footnote with bold text, continued on a second line.",
]

[[case]]
