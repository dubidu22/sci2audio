audit = 5
issue = 65
goal = "The ligature read as its letters: 'Androff' (IN-04)."
blocks = [{ kind = "paragraph", text = "Dr. Androﬀ notes that the effect was small." }]
expected = ["Dr. Androﬀ notes that the effect was small."]

[[case]]
id = "symbols"
audit = 6
issue = 67
goal = "'≥ 18' read 'greater than or equal to 18' and '± 12%' read 'plus or minus 12 percent'; the digits stay for misaki (TP-10)."
blocks = [{ kind = "paragraph", text = "Participants (± 12%) were enrolled vs. 980 controls ≥ 18 years." }]
expected = ["Participants (± 12%) were enrolled vs. 980 controls ≥ 18 years."]

[[case]]
id = "statistics"
audit = 7
issue = 67
goal = "'n = 35' read 'n equals 35', 'p < .05' read 'p less than point zero five', 'CI' read 'confidence interval' (TP-11)."
blocks = [{ kind = "paragraph", text = "A total of n = 35 studies met the criteria. The mean age was M = 4.2 (SD = 1.1) years; the effect was significant (p < .05, 95% CI [1.2, 3.4])." }]
expected = ["A total of n = 35 studies met the criteria. The mean age was M = 4.2 (SD = 1.1) years; the effect was significant (p < .05, 95% CI [1.2, 3.4])."]
utterances = [
    "A total of n = 35 studies met the criteria.",
    "The mean age was M = 4.2 (SD = 1.1) years; the effect was significant (p < .05, 95% CI [1.2, 3.4]).",
]

