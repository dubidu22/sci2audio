# Every hyphen at a line end in the corpus papers (tests/corpus/papers), outside formula and
# table blocks, and how a careful reader reads it (TP-02, issue #65, D-149 to D-152).
#
# One [[paper]] table per paper; `hyphens` lists each line-end hyphen in document order as
# [word before the line break, word after it, reading]:
# - "join": the hyphen only splits a word ("infor-" / "mation" reads "information")
# - "keep": the hyphen belongs to the word ("pre-" / "training" reads "pre-training")
# - "none": no edit; the line break is read as a space ("pre-" / "and post-test")
# Words are the printed characters up to white space, punctuation included.
#
# How the readings were set: where the paper prints the same word elsewhere, joined or
# hyphenated, its own spelling decides (374 of 495); the other 121 were read by hand. The
# [[miss]] tables list where `line-end-hyphens` reads differently today and why; the test
# checks that each miss still reads as `rule_gives`, so a better rule shows up as a diff here.

