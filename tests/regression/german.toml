blocks = [{ kind = "paragraph", text = "Es war −1 °C kalt und dauerte 1,0 s." }]
expected = ["Es war −1 Grad Celsius kalt und dauerte 1,0 Sekunden."]

[[case]]
id = "de-units-millions"
audit = 0
issue = 113
goal = "'Mio.', 'Mrd.' and 'Tsd.' after a number read in full; the full stop at the end of a block stays."
language = "de"
