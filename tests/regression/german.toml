goal = "The document's own spelling comes first: a pair it prints closed elsewhere is joined at the line end too."
language = "de"
blocks = [{ kind = "paragraph", text = "Die deutsch-\nfranzösischen Beziehungen und die deutschfranzösischen Verträge." }]
expected = ["Die deutschfranzösischen Beziehungen und die deutschfranzösischen Verträge."]

[[case]]
id = "de-hyphen-adjective-pair-not-covered"
