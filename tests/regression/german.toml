[[case]]
id = "de-abbreviations-legal-forms"
audit = 0
issue = 264
goal = "German legal forms are read in full, not spelled: 'i. S. v.', 'i. V. m.', 'v.' before a court decision's date, 'S.' after a paragraph; no utterance ends after 'i. V. m.'."
language = "de"
blocks = [
    { kind = "paragraph", text = "Gemäß Art. 2 Abs. 1 i. V. m. Art. 1 Abs. 1 GG gilt das. Ein Recht an Sachen i. S. v. § 90 BGB besteht." },
    { kind = "paragraph", text = "So urteilte das LG Hamburg v. 12.03.2015 nach Art. 6 Abs. 1 S. 1 lit. f DSGVO." },
]
expected = [
    "Gemäß Artikel 2 Absatz 1 in Verbindung mit Artikel 1 Absatz 1 GG gilt das. Ein Recht an Sachen im Sinne von § 90 BGB besteht.",
    "So urteilte das LG Hamburg vom zwölften März 2015 nach Artikel 6 Absatz 1 Satz 1 Buchstabe f DSGVO.",
]
utterances = [
    "Gemäß Artikel 2 Absatz 1 in Verbindung mit Artikel 1 Absatz 1 GG gilt das.",
    "Ein Recht an Sachen im Sinne von § 90 BGB besteht.",
    "So urteilte das LG Hamburg vom zwölften März 2015 nach Artikel 6 Absatz 1 Satz 1 Buchstabe f DSGVO.",
]

[[case]]
id = "de-abbreviations-legal-forms-inside-a-citation"
audit = 0
issue = 264
goal = "'a. F.' and 'n. F.' end no sentence inside a law citation (before 'BDSG', 'Abs.', 'Satz 2'), but do before a new sentence; 'i. S. d.' is read only before a law's '§', 'Art.' or 'Abs.', where it is 'des' (review round 1 of PR #382)."
language = "de"
blocks = [
    { kind = "paragraph", text = "Nach § 28 a. F. BDSG gilt das. Nach Art. 7 a. F. EGBGB gilt das." },
    { kind = "paragraph", text = "Nach § 28 BDSG a. F. Abs. 2 gilt das. Nach Art. 7 n. F. Satz 2 gilt das." },
    { kind = "paragraph", text = "Nach § 28 BDSG a. F. Die Norm ist alt." },
    { kind = "paragraph", text = "Daten i. S. d. § 3 BDSG und i. S. d. DSGVO." },
]
expected = [
    "Nach § 28 alte Fassung BDSG gilt das. Nach Artikel 7 alte Fassung EGBGB gilt das.",
    "Nach § 28 BDSG alte Fassung Absatz 2 gilt das. Nach Artikel 7 neue Fassung Satz 2 gilt das.",
    "Nach § 28 BDSG alte Fassung. Die Norm ist alt.",
    "Daten im Sinne des § 3 BDSG und i. S. d. DSGVO.",
]
utterances = [
    "Nach § 28 alte Fassung BDSG gilt das.",
    "Nach Artikel 7 alte Fassung EGBGB gilt das.",
    "Nach § 28 BDSG alte Fassung Absatz 2 gilt das.",
    "Nach Artikel 7 neue Fassung Satz 2 gilt das.",
    "Nach § 28 BDSG alte Fassung.",
    "Die Norm ist alt.",
    "Daten im Sinne des § 3 BDSG und i. S. d. DSGVO.",
]

