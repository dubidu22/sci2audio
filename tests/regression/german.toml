blocks = [{ kind = "paragraph", text = "Die Fläche war 40 m², das Volumen 3 cm³, die Beschleunigung 9,8 m/s²." }]
expected = ["Die Fläche war 40 Quadratmeter, das Volumen 3 Kubikzentimeter, die Beschleunigung 9,8 Meter pro Sekunde hoch 2."]

[[case]]
id = "de-units-one-by-gender"
audit = 0
issue = 113
goal = "'1' before a unit reads by gender: 'ein Kilogramm', 'eine Sekunde', 'eine Million'."
language = "de"
blocks = [{ kind = "paragraph", text = "Es wog 1 kg, dauerte 1 s und kostete 1 Mio. Euro." }]
expected = ["Es wog ein Kilogramm, dauerte eine Sekunde und kostete eine Million Euro."]

[[case]]
id = "de-units-one-after-prepositions"
audit = 0
