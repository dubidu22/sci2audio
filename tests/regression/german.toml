# German regression cases (v1.1, D-474 to D-482): input blocks and the script the built-in
# text steps produce for them, one line per block that is read. Same format and loader as
# english.toml (sci2audio.testing.regression); every case sets language = "de".
#
# Every text here is written for sci2audio (GPL-3.0-or-later); no third-party text.
# Line-end hyphens are written as layout gives them: a hyphen, then a line break.
#
# `expected` is the script TODAY. A rule PR adds or changes the cases of its rule before it
# changes the rule, and the PR shows the diff. Each rule exists because the German voice's
# front end (espeak-ng German through misaki, #211) reads its input wrong without it; the
# measurements are in the plan of the German rules (#96, #113, #130, #101).

# ---- #96 line-end hyphens (TP-02) ------------------------------------------------------------

[[case]]
id = "de-hyphen-split-words-join"
audit = 0
issue = 96
goal = "A word split by hyphenation is read as one word."
language = "de"
blocks = [{ kind = "paragraph", text = "Die Bun-\ndesregierung hat die Unter-\nsuchung im Früh-\njahr veröffentlicht." }]
expected = ["Die Bundesregierung hat die Untersuchung im Frühjahr veröffentlicht."]

[[case]]
id = "de-hyphen-compound-with-capital-kept"
audit = 0
issue = 96
goal = "A hyphen the author wrote before a capitalised noun stays: 'Corona-Pandemie'."
language = "de"
blocks = [{ kind = "paragraph", text = "Während der Corona-\nPandemie stieg die Nachfrage." }]
expected = ["Während der Corona-Pandemie stieg die Nachfrage."]

[[case]]
id = "de-hyphen-acronym-letter-digit-kept"
audit = 0
issue = 96
goal = "After an acronym, a single letter or before a digit the hyphen stays."
language = "de"
blocks = [{ kind = "paragraph", text = "Die PDF-\ndatei kam per E-\nmail, der Test lief mit COVID-\n19-Daten." }]
expected = ["Die PDF-datei kam per E-mail, der Test lief mit COVID-19-Daten."]

[[case]]
id = "de-hyphen-inside-word-kept"
audit = 0
issue = 96
goal = "A hyphen already inside the first part keeps the one at the line end."
language = "de"
blocks = [{ kind = "paragraph", text = "Eine Ad-hoc-\nanalyse folgte." }]
expected = ["Eine Ad-hoc-analyse folgte."]

[[case]]
id = "de-hyphen-suspended"
audit = 0
issue = 96
goal = "A suspended hyphen before a conjunction stays, with a space: 'Wohnungs- und Sozialarbeit'."
language = "de"
blocks = [{ kind = "paragraph", text = "Sie arbeitet in der Wohnungs-\nund Sozialarbeit, in der Kinder-\noder Jugendhilfe, in Haus-\nsowie Gartenarbeit und weder Ein-\nnoch Ausgang ist frei." }]
expected = ["Sie arbeitet in der Wohnungs- und Sozialarbeit, in der Kinder- oder Jugendhilfe, in Haus- sowie Gartenarbeit und weder Ein- noch Ausgang ist frei."]

[[case]]
id = "de-hyphen-suspended-bis-bzw"
audit = 0
issue = 96
goal = "'bis' and 'bzw.' after a suspended hyphen are conjunctions too; 'bzw.' is read in full (#113)."
language = "de"
blocks = [{ kind = "paragraph", text = "Vom Kinder-\nbis ins Jugendalter, im Wohnungs-\nbzw. Sozialbereich." }]
expected = ["Vom Kinder- bis ins Jugendalter, im Wohnungs- beziehungsweise Sozialbereich."]

[[case]]
id = "de-hyphen-document-spelling"
audit = 0
issue = 96
goal = "The document's own spelling wins: printed 'Datenschutz-Grundverordnung' elsewhere keeps the hyphen; printed 'Ladestation' joins."
language = "de"
blocks = [
    { kind = "paragraph", text = "Die Datenschutz-\nGrundverordnung gilt. Die Lade-\nstation lädt." },
    { kind = "paragraph", text = "Die Datenschutz-Grundverordnung und jede Ladestation." },
]
expected = [
    "Die Datenschutz-Grundverordnung gilt. Die Ladestation lädt.",
    "Die Datenschutz-Grundverordnung und jede Ladestation.",
]

[[case]]
id = "de-hyphen-no-english-second-words"
audit = 0
issue = 96
goal = "German writes such compounds closed: 'kontext-/abhängig' and 'ziel-/orientiert' join; the English second-word list is not used."
language = "de"
blocks = [{ kind = "paragraph", text = "Das Ergebnis ist kontext-\nabhängig und ziel-\norientiert." }]
expected = ["Das Ergebnis ist kontextabhängig und zielorientiert."]

[[case]]
id = "de-hyphen-umlaut-and-sharp-s"
audit = 0
issue = 96
goal = "Umlauts and ß are letters of the word on both sides."
language = "de"
blocks = [{ kind = "paragraph", text = "Die Ergeb-\nnisse der Übersetzungs-\nprüfung und die Grö-\nße der Stichprobe." }]
expected = ["Die Ergebnisse der Übersetzungsprüfung und die Größe der Stichprobe."]

[[case]]
id = "de-hyphen-austrian-tag"
audit = 0
issue = 96
goal = "'de-AT' and 'de-CH' use the German rule."
language = "de-AT"
blocks = [{ kind = "paragraph", text = "Die Kinder-\nund Jugendhilfe im Bundes-\nland." }]
expected = ["Die Kinder- und Jugendhilfe im Bundesland."]

[[case]]
id = "de-hyphen-suspended-als-auch"
audit = 0
issue = 96
goal = "'sowohl Lehr- als auch Lernprozesse': 'als' counts before 'auch'; 'Materi-/als' alone is a split word."
language = "de"
blocks = [{ kind = "paragraph", text = "Sowohl Lehr-\nals auch Lernprozesse; die Wahl des Materi-\nals zählt." }]
expected = ["Sowohl Lehr- als auch Lernprozesse; die Wahl des Materials zählt."]

[[case]]
id = "de-hyphen-suspended-abbreviated-conjunctions"
audit = 0
issue = 96
goal = "'u.', 'o.', 'vs.' and 'resp.' with their full stop, and 'versus', count as conjunctions."
language = "de"
blocks = [{ kind = "paragraph", text = "Die Kinder-\nu. Jugendhilfe, der Ein-\no. Ausgang, Lehr-\nvs. Lernprozesse, Lehr-\nversus Lernzeit und Haupt-\nresp. Nebeneffekte." }]
expected = ["Die Kinder- und Jugendhilfe, der Ein- o. Ausgang, Lehr- versus Lernprozesse, Lehr- versus Lernzeit und Haupt- respektive Nebeneffekte."]

# ---- #221 reference list (TP-06) -------------------------------------------------------------

[[case]]
id = "de-reference-list-literatur"
audit = 0
issue = 221
goal = "A section headed 'Literatur' (or 'Literaturverzeichnis', 'Quellen', ...) is not read."
language = "de"
blocks = [
    { kind = "heading", text = "1 Einleitung" },
    { kind = "paragraph", text = "Der Text wird gelesen." },
    { kind = "heading", text = "Literatur" },
    { kind = "paragraph", text = "Müller, A. (2019). Eine Studie. Zeitschrift 1, 1–9." },
]
sections = [
    { title = "1 Einleitung", level = 1, start = 0, end = 2 },
    { title = "Literatur", level = 1, start = 2, end = 4 },
]
expected = ["1 Einleitung", "Der Text wird gelesen."]

[[case]]
id = "de-reference-list-numbered-quellen"
audit = 0
issue = 221
goal = "A printed number before the title is taken off: '7 Quellenverzeichnis'."
language = "de"
blocks = [
    { kind = "paragraph", text = "Der Text wird gelesen." },
    { kind = "heading", text = "7 Quellenverzeichnis" },
    { kind = "paragraph", text = "Schmidt, B. (2020). Ein Buch. Berlin." },
]
sections = [{ title = "7 Quellenverzeichnis", level = 1, start = 1, end = 3 }]
expected = ["Der Text wird gelesen."]

[[case]]
id = "de-reference-list-combined-title"
audit = 0
issue = 221
goal = "The combined title of German theses, 'Quellen- und Literaturverzeichnis', is a reference list too."
language = "de"
blocks = [
    { kind = "paragraph", text = "Der Text wird gelesen." },
    { kind = "heading", text = "Quellen- und Literaturverzeichnis" },
    { kind = "paragraph", text = "Schmidt, B. (2020). Ein Buch. Berlin." },
]
sections = [{ title = "Quellen- und Literaturverzeichnis", level = 1, start = 1, end = 3 }]
expected = ["Der Text wird gelesen."]

[[case]]
id = "de-reference-list-english-heading"
audit = 0
issue = 221
goal = "A German paper may head its list 'References': English names count in German too."
language = "de"
blocks = [
    { kind = "paragraph", text = "Der Text wird gelesen." },
    { kind = "heading", text = "References" },
    { kind = "paragraph", text = "Doe, J. (2020). A study." },
]
sections = [{ title = "References", level = 1, start = 1, end = 3 }]
expected = ["Der Text wird gelesen."]

[[case]]
id = "de-reference-list-other-sections-read"
audit = 0
issue = 221
goal = "Other sections are read: 'Literaturüberblick' is no reference list."
language = "de"
blocks = [
    { kind = "heading", text = "2 Literaturüberblick" },
    { kind = "paragraph", text = "Frühere Arbeiten werden besprochen." },
]
sections = [{ title = "2 Literaturüberblick", level = 1, start = 0, end = 2 }]
expected = ["2 Literaturüberblick", "Frühere Arbeiten werden besprochen."]

# ---- #113 abbreviations (TP-08) --------------------------------------------------------------

[[case]]
id = "de-abbreviations-anywhere"
audit = 0
issue = 113
goal = "Abbreviations the voice spells are read in full: 'z. B.', 'd. h.', 'bzw.', 'ca.', 'vgl.', 'ggf.', 'i. d. R.'."
language = "de"
blocks = [{ kind = "paragraph", text = "Das gilt z. B. für Kinder, d. h. bis 14 Jahre, bzw. für ca. die Hälfte; vgl. dazu ggf. die Regel, die i. d. R. gilt." }]
expected = ["Das gilt zum Beispiel für Kinder, das heißt bis 14 Jahre, beziehungsweise für zirka die Hälfte; vergleiche dazu gegebenenfalls die Regel, die in der Regel gilt."]

[[case]]
id = "de-abbreviations-without-spaces"
audit = 0
issue = 113
goal = "The forms without a space are read too: 'z.B.', 'd.h.', 'u.a.'."
language = "de"
blocks = [{ kind = "paragraph", text = "Es gibt z.B. Hunde, d.h. Tiere, u.a. in Städten." }]
expected = ["Es gibt zum Beispiel Hunde, das heißt Tiere, unter anderem in Städten."]

[[case]]
id = "de-abbreviations-sentence-start"
audit = 0
issue = 113
goal = "At the start of a sentence the reading starts with a capital: 'Z. B.' reads 'Zum Beispiel'."
language = "de"
blocks = [{ kind = "paragraph", text = "Z. B. sinkt der Wert. Vgl. Abschnitt 2." }]
expected = ["Zum Beispiel sinkt der Wert. Vergleiche Abschnitt 2."]

[[case]]
id = "de-abbreviations-page-and-see"
audit = 0
issue = 113
goal = "'S.' before a number reads 'Seite', 's.' reads 'siehe': they differ only by case; 's. o.' at the end keeps its full stop."
language = "de"
blocks = [{ kind = "paragraph", text = "Die Tabelle steht auf S. 12, s. auch S. 14 und s. o." }]
expected = ["Die Tabelle steht auf Seite 12, siehe auch Seite 14 und siehe oben."]

[[case]]
id = "de-abbreviations-initial-s-left-alone"
audit = 0
issue = 113
goal = "An initial 'S.' before a name is no page: left as printed."
language = "de"
blocks = [{ kind = "paragraph", text = "Die Studie von S. Müller zeigt es." }]
expected = ["Die Studie von S. Müller zeigt es."]

[[case]]
id = "de-abbreviations-labels"
audit = 0
issue = 113
goal = "Label abbreviations before a number or label read in full: 'Abb. 3', 'Tab. 2', 'Gl. (4)', 'Kap. 5', 'Nr. 7'."
language = "de"
blocks = [{ kind = "paragraph", text = "Siehe Abb. 3a, Tab. 2, Gl. (4), Kap. 5, Abschn. 2.1, Anh. B und Nr. 7." }]
expected = ["Siehe Abbildung 3a, Tabelle 2, Gleichung (4), Kapitel 5, Abschnitt 2.1, Anhang B und Nummer 7."]

[[case]]
id = "de-abbreviations-titles"
audit = 0
issue = 113
goal = "'Dr.' and 'Prof.' before a name read in full."
language = "de"
blocks = [{ kind = "paragraph", text = "Prof. Dr. Schmidt leitet das Projekt." }]
expected = ["Professor Doktor Schmidt leitet das Projekt."]

[[case]]
id = "de-abbreviations-end-of-list"
audit = 0
issue = 113
goal = "'usw.' and 'etc.' at the end of a sentence keep its full stop, so the sentence still ends."
language = "de"
blocks = [{ kind = "paragraph", text = "Es gab Hunde, Katzen usw. Die Studie lief lange, mit Mäusen etc." }]
expected = ["Es gab Hunde, Katzen und so weiter. Die Studie lief lange, mit Mäusen et zetera."]
utterances = ["Es gab Hunde, Katzen und so weiter.", "Die Studie lief lange, mit Mäusen et zetera."]

[[case]]
id = "de-abbreviations-u-a-before-a-year"
audit = 0
issue = 113
goal = "'u. a.' before a year is 'und andere' (after authors), elsewhere 'unter anderem'."
language = "de"
blocks = [{ kind = "paragraph", text = "Laut Müller u. a. (2019) gilt das u. a. in Berlin." }]
expected = ["Laut Müller und andere (2019) gilt das unter anderem in Berlin."]

[[case]]
id = "de-abbreviations-u-a-before-a-year-after-a-lower-case-word"
audit = 0
issue = 113
goal = "'u. a.' before a year reads 'und andere' only after a name: 'gilt u. a. 2019' is 'unter anderem' (review of PR #228)."
language = "de"
blocks = [{ kind = "paragraph", text = "Das gilt u. a. 2019 und 2020." }]
expected = ["Das gilt unter anderem 2019 und 2020."]

[[case]]
id = "de-abbreviations-capitals-with-umlauts"
audit = 0
issue = 113
goal = "A capital with an umlaut counts as a capital after an abbreviation: a name after 'Dr.', a new sentence after 'usw.' (review of PR #228)."
language = "de"
blocks = [{ kind = "paragraph", text = "Laut Prof. Dr. Özdemir gilt das für Katzen usw. Über die Studie wissen wir mehr." }]
expected = ["Laut Professor Doktor Özdemir gilt das für Katzen und so weiter. Über die Studie wissen wir mehr."]
utterances = ["Laut Professor Doktor Özdemir gilt das für Katzen und so weiter.", "Über die Studie wissen wir mehr."]

[[case]]
id = "de-abbreviations-lower-case-ae-and-ff"
audit = 0
issue = 113
goal = "'o. ä.', 'o.ä.', 'u. ä.', 'u.ä.' with a lower-case 'ä' read too; 'ff.' after a page reads 'folgende' (review of PR #228)."
language = "de"
blocks = [{ kind = "paragraph", text = "Hunde o. ä. sind hier, Katzen o.ä. auch, Pferde u. ä. ebenso, Mäuse u.ä. nicht, siehe S. 12 ff." }]
expected = ["Hunde oder Ähnliches sind hier, Katzen oder Ähnliches auch, Pferde und Ähnliches ebenso, Mäuse und Ähnliches nicht, siehe Seite 12 folgende."]

[[case]]
id = "de-abbreviations-et-al-left-alone"
audit = 0
issue = 113
goal = "'et al.' is read right by the voice and left as printed."
language = "de"
blocks = [{ kind = "paragraph", text = "Schmidt et al. zeigen es." }]
expected = ["Schmidt et al. zeigen es."]

# ---- #113 units and symbols (TP-10) ----------------------------------------------------------

[[case]]
id = "de-units-after-numbers"
audit = 0
issue = 113
goal = "Units after a number read as German words, plural after any number but 1."
language = "de"
blocks = [{ kind = "paragraph", text = "Die Probe wog 5 kg, lief 12 km in 3 h und 20 min bei 37 °C mit 2 ml Wasser." }]
expected = ["Die Probe wog 5 Kilogramm, lief 12 Kilometer in 3 Stunden und 20 Minuten bei 37 Grad Celsius mit 2 Milliliter Wasser."]

[[case]]
id = "de-units-decimal-comma-and-thousands"
audit = 0
issue = 113
goal = "Numbers printed German style still take their unit: '2,5 km', '1.500 m', '0,5 s'."
language = "de"
blocks = [{ kind = "paragraph", text = "Sie lief 2,5 km, dann 1.500 m in 0,5 s." }]
expected = ["Sie lief 2,5 Kilometer, dann 1.500 Meter in 0,5 Sekunden."]

[[case]]
id = "de-units-per"
audit = 0
issue = 113
goal = "'/' reads 'pro', the unit after it singular: '50 km/h', '5 mg/kg', '3 mg/Tag'."
language = "de"
blocks = [{ kind = "paragraph", text = "Er fuhr 50 km/h, die Dosis war 5 mg/kg und 3 mg/Tag." }]
expected = ["Er fuhr 50 Kilometer pro Stunde, die Dosis war 5 Milligramm pro Kilogramm und 3 Milligramm pro Tag."]

[[case]]
id = "de-units-square-and-cubic-in-one-word"
