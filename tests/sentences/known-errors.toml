# Every sentence-boundary error the script makes on the sentence sets today (D-719).
# `tests/unit/test_sentence_boundaries.py` fails on an error that is not listed here, and on a
# listed error that no longer happens: the PR that fixes one removes its entry (a ratchet).
#
# Each entry: `file` (a sentence file's name), `kind` ("FP": the script starts a sentence the
# truth does not have; "FN": the script misses one), `at` (the truth's words around the gap,
# as the test prints them), `class`, `issue` (the Issue that fixes it) and `why`.
# Classes: layout-split, layout-join, abbreviation, ordinal, initial, label, citation, quote,
# lowercase-start, heading-number, other.
#
# An entry whose `why` starts "kept on purpose" is a limit the rules keep (#477): the rule that
# would fix it breaks a more common shape.
#
# Floors: precision and recall of the natural sets (corpus papers and own samples, not the
# stress sets) by language, rounded down to three places. A PR that raises them raises these.

[floors.en]
precision = 1.000
recall = 0.993

[floors.de]
precision = 1.000
recall = 0.991

# --- natural sets ---

[[error]]
file = "sci2audio-sample-plain"
kind = "FN"
at = "LISTENING TO PAPERS | A pilot note written"
class = "layout-join"
issue = 466
why = "a title line and its subtitle line are one plain-text paragraph"

[[error]]
file = "sci2audio-sample-plain"
kind = "FN"
at = "for microseconds. first point | second point Roses are"
class = "layout-join"
issue = 466
why = "'- ' list items are lines of one plain-text paragraph"

[[error]]
file = "sci2audio-beispiel-text"
kind = "FN"
at = "PAPERS HÖREN | Eine Pilotnotiz für die"
class = "layout-join"
issue = 466
why = "a title line and its subtitle line are one plain-text paragraph"

[[error]]
file = "sci2audio-beispiel-text"
kind = "FN"
at = "„wie diese“. erster Punkt | zweiter Punkt Rosen sind"
class = "layout-join"
issue = 466
why = "'- ' list items are lines of one plain-text paragraph"

# --- stress sets ---

[[error]]
file = "stress-en"
kind = "FP"
at = "came from the U.S. | Census Bureau. Prof. Jones"
class = "abbreviation"
issue = 477
why = "kept on purpose: 'U.S.' is no abbreviation of the English list, so its full stop ends the sentence; it ends a sentence as often as it stands before a name"

[[error]]
file = "stress-en"
kind = "FN"
at = "set is called A. | Then set B follows."
class = "initial"
issue = 477
why = "kept on purpose: a single capital before a full stop is read as an initial (documented limit; after a maths symbol or a label word it is cut)"

[[error]]
file = "stress-en"
kind = "FN"
at = "We plot with seaborn. | seaborn is a plotting"
class = "lowercase-start"
issue = 477
why = "kept on purpose: a sentence must start with a capital, a digit or an opening quote or bracket"

[[error]]
file = "stress-en"
kind = "FN"
at = "pandas reads the table. | iOS apps were not"
class = "lowercase-start"
issue = 477
why = "kept on purpose: a sentence must start with a capital, a digit or an opening quote or bracket"

[[error]]
file = "stress-de"
kind = "FN"
at = "sofort. Es waren 3. | Studien zeigen das seit"
class = "ordinal"
issue = 477
why = "kept on purpose: a number before a capital noun is read as an ordinal (documented limit, #227)"
