# Every sentence-boundary error the script makes on the sentence sets today (D-719).
# `tests/unit/test_sentence_boundaries.py` fails on an error that is not listed here, and on a
# listed error that no longer happens: the PR that fixes one removes its entry (a ratchet).
#
# Each entry: `file` (a sentence file's name), `kind` ("FP": the script starts a sentence the
# truth does not have; "FN": the script misses one), `at` (the truth's words around the gap,
# as the test prints them), `class`, `issue` (the Issue that fixes it) and `why`.
# Classes: layout-split, layout-join, abbreviation, ordinal, initial, label, citation, quote,
# lowercase-start, heading-number, other.
#
# An entry whose `why` starts "kept on purpose" is a limit the rules keep (#477): the rule that
# would fix it breaks a more common shape.
#
# Floors: precision and recall of the natural sets (corpus papers and own samples, not the
# stress sets) by language, rounded down to three places. A PR that raises them raises these.

[floors.en]
precision = 1.000
recall = 1.000

[floors.de]
precision = 1.000
recall = 1.000

# --- natural sets ---

# --- stress sets ---

[[error]]
file = "stress-en"
kind = "FN"
at = "done in the U.S. | Researchers in Canada did"
class = "abbreviation"
issue = 477
why = "kept on purpose (D-744): a dotted capital abbreviation ends a sentence only before a word of data/en/sentence_openers.toml, which holds no nouns, so a sentence that starts with a noun after 'U.S.' stays in the same utterance; the price of not cutting 'U.S. Census Bureau'"

[[error]]
file = "stress-en"
kind = "FN"
at = "We plot with seaborn. | seaborn is a plotting"
class = "lowercase-start"
issue = 477
why = "kept on purpose (D-744): a sentence must start with a capital, a digit or an opening quote or bracket; allowing a lower-case start would cut after every abbreviation the lists lack ('approx. five')"

[[error]]
file = "stress-en"
kind = "FN"
at = "pandas reads the table. | iOS apps were not"
class = "lowercase-start"
issue = 477
why = "kept on purpose (D-744): a sentence must start with a capital, a digit or an opening quote or bracket; allowing a lower-case start would cut after every abbreviation the lists lack ('approx. five')"

[[error]]
file = "stress-de"
kind = "FN"
at = "sofort. Es waren 3. | Studien zeigen das seit"
class = "ordinal"
issue = 477
why = "kept on purpose (D-744): a number before a capital noun is read as an ordinal, since German capitalises nouns and the opener list holds none (documented limit, #227, D-530)"
